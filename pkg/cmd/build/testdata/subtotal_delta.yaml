# subtotal.yaml with the subtotal a dollar over its rows, declared.
schema_version: 1
doc_id: livermore-budget-fy2026-2027

rules:
  - id: listing
    kind: expenditure
    basis: adopted
    scope: cip-project-listing
    grain: category
    units: dollars
    rows:
      - {label: "Alpha", category: capital-projects}
      - {label: "Beta", category: capital-projects}
      - label: "SUBTOTAL"
        skip: true
        subtotal: 1
        subtotal_deltas:
          - {column: "FY A", delta_cents: 100, note: "the page prints a dollar over its rows"}
    parts:
      - page: 95
        section: "FY A\n"
        stop_at: "END"
        column_headers: ["FY A"]
        columns:
          - {fiscal_year: 2026}
