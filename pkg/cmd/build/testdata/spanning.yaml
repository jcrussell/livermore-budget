# A block whose rows straddle a page break, so its printed total covers rows on
# two parts and each row is placed on the page that prints it. Modelled on
# Budget Book pp.169-170, where Environmental Services prints Wages & Benefits
# on p169 and Services & Supplies plus its Total on p170 (fisc-w0o).
#
# The point of the fixture is the REPORT. Before total_spans_parts a rule like
# this had no working exit: keeping total_row failed the build on the head
# part, and dropping it reported BOTH parts as "the rule declares no total_row"
# -- a claim about the rule standing in for a claim about the document. Neither
# part may end up in parts_unchecked here.
schema_version: 1
doc_id: livermore-budget-fy2026-2027

rules:
  - id: straddling-services
    kind: expenditure
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    total_row: "Total Services"
    total_spans_parts: true
    rows:
      - {label: "Wages & Benefits", page: 81, category: wages-and-benefits}
      - {label: "Services & Supplies", page: 82, category: services-and-supplies}
    parts:
      - page: 81
        section: "SERVICES:"
        stop_at: "END OF PAGE"
        columns:
          - {fund_group: general, fiscal_year: 2026}
      - page: 82
        section: "SERVICES:"
        stop_at: "Total Services"
        columns:
          - {fund_group: general, fiscal_year: 2026}
