# The block of subtotal.yaml read by two rules, as Budget Book pp.80-81 is by
# debt-service-principal and debt-service-interest: each rule's chain compares
# the one printed subtotal, and the build counts it once.
schema_version: 1
doc_id: livermore-budget-fy2026-2027

rules:
  - id: listing
    kind: expenditure
    basis: adopted
    scope: cip-project-listing
    grain: category
    units: dollars
    rows:
      - {label: "Alpha", category: capital-projects}
      - {label: "Beta", category: capital-projects}
      - {label: "SUBTOTAL", skip: true, subtotal: 1}
    parts:
      - page: 95
        section: "FY A\n"
        stop_at: "END"
        column_headers: ["FY A"]
        columns:
          - {fiscal_year: 2026}

  - id: listing-again
    kind: expenditure
    basis: adopted
    scope: cip-project-listing
    units: dollars
    rows:
      - {label: "Alpha", skip: true}
      - {label: "Beta", skip: true}
      - {label: "SUBTOTAL", skip: true, subtotal: 1}
    parts:
      - page: 95
        section: "FY A\n"
        stop_at: "END"
        column_headers: ["FY A"]
        columns:
          - {fiscal_year: 2026}
