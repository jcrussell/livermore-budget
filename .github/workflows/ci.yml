name: CI

# Every job here is pure Go over the committed artifacts under
# data/extracted/. Nothing in CI needs the source PDFs, and that is a property
# worth spending a few lines to keep:
#
#   data/pdf/** is the only thing in Git LFS (3 files, ~67 MB). GitHub's free
#   LFS tier is 1 GB of bandwidth a month, so ~14 checkouts with smudge on
#   would exhaust it and every job in the repository would start failing on a
#   quota error that looks nothing like its cause.
#
# So each checkout sets `lfs: false` explicitly rather than relying on the
# default, and GIT_LFS_SKIP_SMUDGE is set workflow-wide so a nested action or
# a future `git checkout` cannot turn the smudge filter back on.
#
# Note what this is and is not. Every job here was verified to pass with
# data/pdf/ entirely absent, so nothing breaks today -- but that is a fact
# about the current code, not a check. Nothing in this workflow FAILS if a
# future job sets `lfs: true`, so these two lines are a convention held by
# review, not an assertion.
#
# `fisc verify --full` is the one thing that has a reason to read the PDFs, and
# it now exists (fisc-1wr.5): it hashes each document against the sha256 that
# data/sources.yaml and the extraction manifest independently record. It is NOT
# run here, deliberately -- that job needs `lfs: true` and would spend the
# bandwidth budget above on every push. A monthly schedule for it is fisc-v87;
# a pointer-only checkout makes that check report ERROR with `git lfs pull`,
# not a false failure, so the job has to fetch for real.
#
# The Pages deploy lives at the bottom of this file rather than in its own
# workflow, and that placement is the whole point. Two workflows both triggered
# by `push: main` are two CONCURRENT runs with no ordering between them, so the
# deploy -- having fewer jobs -- would routinely publish before the tests
# finished, and a red CI would arrive after the site was already live. As a job
# here it can simply `needs:` the gates (fisc-60x).

on:
  push:
    branches: [main]
  pull_request:

# Read-only by DEFAULT (byob-security.5): this is the floor every job inherits,
# and all but one keep it. The two Pages jobs at the bottom raise it on
# themselves and nowhere else -- see the note above `pages-build`.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it. main is excluded from
# cancellation by including the ref in the group: two pushes to main are two
# different states worth knowing about, whereas two pushes to a PR branch are
# a work in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Belt and braces with `lfs: false` below: this stops the smudge filter even
  # if some step runs git itself. See the bandwidth note at the top.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .golangci-version exists so the pin lives in one place; the Makefile
      # and a developer's shell read the same file. golangci-lint-action v9
      # expects a v2.x golangci-lint, which 2.11.4 is.
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=v$(tr -d '[:space:]' < .golangci-version)" >> "$GITHUB_OUTPUT"
      # Not `make lint`: the action installs the pinned binary and caches its
      # analysis, which a bare `golangci-lint run` on a runner cannot do. The
      # configuration is still .golangci.yml, so this and `make lint` enforce
      # the same rules.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Not `make fmt`: that target rewrites the tree in place and exits 0, so
      # in CI it would launder unformatted code into a green run. Reported
      # rather than repaired, over the same five directories the Makefile
      # covers -- site/ is in that list because site/embed.go lives there and
      # an earlier three-directory version of both silently skipped it, and
      # tools/ because it was named one subdirectory at a time and a new one
      # went in unformatted-unchecked.
      #
      # This is the gofmt half only. Import grouping is goimports with
      # local-prefixes, which gofmt does not know about and `make fmt` will
      # happily "fix" the wrong way; the lint job is what catches that.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg ./site ./tools)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean; run 'make fmt':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tests read fixtures under testdata/ and never Python, the PDFs, or
      # the network, so this job needs nothing the checkout did not bring.
      - run: make test

  js:
    name: app.js layout claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      # The only job in this workflow that needs node, and it needs nothing
      # else: no npm install, no package.json, no lockfile. tools/jscheck loads
      # the committed site/app.js and the vendored d3 into a vm and re-measures
      # the figures that file quotes about itself. Node stays off the deploy
      # path -- pages-build runs `fisc export` and never touches this.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - run: make js

  narration:
    name: narration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Go arm reads committed source and is a real gate here. The memory
      # arm warns and continues, because bd is not installed on this runner and
      # the memories live in a Dolt database that no checkout carries -- so this
      # job proves the source half only, which is the half CI can prove.
      - run: make narration

  beadrefs:
    name: beadrefs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # This one is a full gate here rather than an advisory check: it resolves
      # against .beads/issues.jsonl, which the checkout carries, so bd being
      # absent from the runner costs it nothing.
      - run: make beadrefs

  doccheck:
    name: doccheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A full gate, for the same reason beadrefs is: it resolves against
      # AGENTS.md, which every checkout carries.
      - run: make doccheck

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vet

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      # go-version-file, like every other job, so this scans the same toolchain
      # the build job compiles with. Most of what govulncheck reports for this
      # module is standard library, and which standard library it sees is
      # whichever toolchain is installed -- so scanning `stable` while shipping
      # a binary built from the go.mod floor would answer a question nobody
      # asked. The `toolchain` directive in go.mod is what keeps the two the
      # same; see the comment there.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The scanner is pinned like everything else; what has to be fresh is the
      # vulnerability database, and govulncheck fetches that from vuln.go.dev
      # on every run. Installed rather than added to go.mod, so it does not
      # become a dependency of the module the tidy job checks.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Not `make tidy`: that target rewrites go.mod/go.sum and exits 0. Run it
      # and then assert the tree did not move, which is the check.
      - name: Check go.mod and go.sum are tidy
        run: |
          make tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed go.mod/go.sum; run 'make tidy' and commit the result:" >&2
            git --no-pager diff -- go.mod go.sum >&2
            exit 1
          fi

  facts:
    name: facts.jsonl matches the rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # facts.jsonl is a build product: every line is derivable from
      # data/extracted/ plus mappings/. Rebuild it somewhere else and compare
      # byte for byte, rather than overwriting the committed file and diffing
      # against the index. `git diff --exit-code` would be just as strict today
      # -- facts.jsonl carries no CR bytes and `text eol=lf` forces LF in the
      # worktree -- but it would leave the committed fact store overwritten in
      # the workspace on failure, and it compares through the clean filter
      # rather than the bytes, which is not what this check claims to do.
      #
      # --output is resolved against the repository root and refuses absolute
      # paths (build.validateRepoPath), so the rebuild cannot go to $(mktemp
      # -d). bin/ is gitignored and `make clean` already owns it, so writing
      # there leaves the tree exactly as checked out.
      - name: Rebuild the fact store
        run: ./bin/fisc build --output bin/facts-rebuilt.jsonl
      - name: Compare against the committed fact store
        run: |
          if ! cmp -s bin/facts-rebuilt.jsonl facts/facts.jsonl; then
            echo "facts/facts.jsonl does not match what the rules produce." >&2
            echo "Usual causes, most likely first: the resolver or the amount grammar" >&2
            echo "changed (internal/mapping, internal/amount, pkg/cmd/build); mappings/ or" >&2
            echo "data/extracted/ changed without a rebuild; or facts.jsonl was edited by" >&2
            echo "hand. Run 'fisc build' and commit the result in the same commit as the" >&2
            echo "change that caused it." >&2
            echo "--- committed  +++ rebuilt (first 50 lines):" >&2
            diff -u facts/facts.jsonl bin/facts-rebuilt.jsonl | head -n 50 >&2
            exit 1
          fi

  verify:
    name: fisc verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # This job is the reason data/pdf may stay absent: verify reads the
      # committed fact store, the rules, the three registries under data/, and
      # every artifact under data/extracted/ -- which it hashes against the
      # manifest that lists them -- and nothing else. Without --full it never
      # opens data/pdf/; the one check that would is reported as SKIPPED, with
      # the reason, on the last lines of the log. It is a separate job from `facts`
      # rather than a step in it because the two answer different questions --
      # "the rules still produce this file" and "this file's claims hold" -- and a
      # single job would report only whichever failed first.
      #
      # --strict, which fails on a VACUOUS check that no entry in
      # internal/check's declaredVacuous accounts for. It used to be omitted,
      # with a prose comment here naming the beads that would retire the three
      # vacuous checks. That comment was the wrong place for the claim: nothing
      # checked it, and every one of those checks is blocked behind work far
      # down the backlog, so the flag would have been red on every run from the
      # day it landed and a permanently red gate gets commented out
      # (fisc-1wr.4). The reasons are now in the source, printed verbatim on
      # every run beside the bead that deletes each one, and a vacuous check
      # nobody has declared fails HERE on the day it appears (fisc-z0p).
      - name: Check the corpus
        run: ./bin/fisc verify --strict

  # ---------------------------------------------------------------- publish --
  #
  # Everything below this line only runs on a push to main that has already gone
  # green. On a pull request the `if` is false and both jobs are skipped, so a
  # fork PR can never reach the write scopes.
  #
  # The `needs` list IS the gate, and it is why nothing here re-runs a check:
  # `facts` already proved facts.jsonl is what the rules produce, and `verify`
  # already proved the corpus holds. A separate workflow could not depend on
  # either and would have had to duplicate both.
  #
  # govulncheck is deliberately NOT in that list. Its result depends on a
  # vulnerability database fetched at run time, not on the commit, so the same
  # tree can be green today and red tomorrow -- and the published artefact is
  # static HTML, CSS and vendored d3. No Go code ships, so nothing govulncheck
  # reports can reach a visitor. Gating publication on it would mean the site
  # stops being republishable for reasons that have nothing to do with the site.
  pages-build:
    name: package the site
    needs: [lint, format, narration, beadrefs, doccheck, build, test, vet, tidy, facts, verify, js]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs the site does not read; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Not `make site`: that target also prints the local "serve it" hint,
      # which is noise in a runner log. Same command underneath. `fisc export`
      # reads facts/facts.jsonl and never re-runs the mapping engine, so this
      # cannot move a published figure -- it republishes what `fisc build`
      # committed and the jobs above just finished checking.
      - name: Export the site
        run: ./bin/fisc export --clean
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  pages-deploy:
    name: deploy to Pages
    needs: pages-build
    runs-on: ubuntu-latest
    # The only place in this file that is not read-only. Job-level permissions
    # REPLACE the workflow-level block rather than adding to it, so this is the
    # complete grant: no `contents`, because deploy-pages reads the uploaded
    # artefact and not the repository.
    permissions:
      pages: write
      id-token: write
    # The workflow-wide concurrency group is per-ref and deliberately does not
    # cancel on main, which is right for CI but leaves two quick pushes racing
    # for one Pages deployment. This job takes its own group so those queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
