name: CI

# Every job is pure Go over the committed artifacts under data/extracted/;
# none needs the source PDFs, the only LFS content (~67 MB against a free tier of
# 1 GB of bandwidth a month). Each checkout sets `lfs: false` and
# GIT_LFS_SKIP_SMUDGE is set workflow-wide; that is a convention held by review,
# not a check. `fisc verify --full` reads the PDFs, monthly, in verify-full.yml.
#
# The Pages deploy is a job here so it can `needs:` the gates; a second workflow
# on `push: main` would run concurrently and could publish before CI went red.

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (byob-security.5); pages-deploy raises it on itself.
permissions:
  contents: read

# A newer push cancels an in-flight run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # With `lfs: false` on every checkout; see the header.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .golangci-version is the one pin; the Makefile reads it too.
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=v$(tr -d '[:space:]' < .golangci-version)" >> "$GITHUB_OUTPUT"
      # Not `make lint`: the action installs the pinned binary and caches its
      # analysis. Both read .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Not `make fmt`, which rewrites in place and exits 0. Same directories as
      # the Makefile's. Import grouping is goimports', so the lint job catches it.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg ./schema ./site ./tools)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean; run 'make fmt':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  js:
    name: app.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      # The only job that needs node; node stays off the deploy path.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make js

  narration:
    name: narration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Go and beads arms are gates here; the memory arm warns and continues,
      # bd being absent.
      - run: make narration

  beadrefs:
    name: beadrefs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make beadrefs

  doccheck:
    name: doccheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make doccheck

  extract-schema:
    name: extract.py schema subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      # The runner's own python3 and no poppler: the test drives only
      # check_against_schema, over a committed manifest.
      - run: make extract-test

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vet

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      # go-version-file, so this scans the standard library the build compiles
      # with; go.mod's `toolchain` directive keeps the two the same.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A pinned scanner; the vulnerability database is fetched fresh each run.
      # Installed rather than added to go.mod.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Not `make tidy`: that target rewrites go.mod/go.sum and exits 0. Run it
      # and then assert the tree did not move, which is the check.
      - name: Check go.mod and go.sum are tidy
        run: |
          make tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed go.mod/go.sum; run 'make tidy' and commit the result:" >&2
            git --no-pager diff -- go.mod go.sum >&2
            exit 1
          fi

  facts:
    name: facts.jsonl matches the rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Rebuild beside the committed file and compare bytes. --output must be
      # repo-relative (build.validateRepoPath); bin/ is gitignored.
      - name: Rebuild the fact store
        run: ./bin/fisc build --output bin/facts-rebuilt.jsonl
      - name: Compare against the committed fact store
        run: |
          if ! cmp -s bin/facts-rebuilt.jsonl facts/facts.jsonl; then
            echo "facts/facts.jsonl does not match what the rules produce." >&2
            echo "Usual causes, most likely first: the resolver or the amount grammar" >&2
            echo "changed (internal/mapping, internal/amount, pkg/cmd/build); mappings/ or" >&2
            echo "data/extracted/ changed without a rebuild; or facts.jsonl was edited by" >&2
            echo "hand. Run 'fisc build' and commit the result in the same commit as the" >&2
            echo "change that caused it." >&2
            echo "--- committed  +++ rebuilt (first 50 lines):" >&2
            diff -u facts/facts.jsonl bin/facts-rebuilt.jsonl | head -n 50 >&2
            exit 1
          fi

  verify:
    name: fisc verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs no Go code reads; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # verify never opens data/pdf/ without --full; that one check reports
      # SKIPPED. A separate job from `facts` so each failure is reported. --strict
      # fails on a vacuous check internal/check's declaredVacuous does not account
      # for (fisc-z0p).
      - name: Check the corpus
        run: ./bin/fisc verify --strict

  # ---------------------------------------------------------------- publish --
  #
  # Runs only on a push to main that has gone green; a pull request skips both
  # jobs, so a fork never reaches the write scopes. The `needs` list is the gate,
  # so nothing here re-runs a check. govulncheck is not in it: its result depends
  # on a database fetched at run time, and no Go code ships to a visitor.
  pages-build:
    name: package the site
    needs: [lint, format, narration, beadrefs, doccheck, extract-schema, build, test, vet, tidy, facts, verify, js]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # ~67 MB of PDFs the site does not read; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Not `make site`, which prints a local serve hint. Same command.
      - name: Export the site
        run: ./bin/fisc export --clean
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  pages-deploy:
    name: deploy to Pages
    needs: pages-build
    runs-on: ubuntu-latest
    # The only grant above read-only. Job-level permissions replace the
    # workflow's, so this is complete; deploy-pages reads the artefact, not the
    # repository.
    permissions:
      pages: write
      id-token: write
    # Its own group, so two quick pushes to main queue for one deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
