name: verify --full

# The one check that reads data/pdf/: `fisc verify --full` hashes each source
# PDF against data/sources.yaml and the extraction manifest, which record it
# independently (tools/extract.py never reads data/sources.yaml).
#
# Its own file because ci.yml sets GIT_LFS_SKIP_SMUDGE workflow-wide, which no
# job can unset, so this file sets no env block at all. Monthly because the PDFs
# are ~67 MB against a free LFS tier of 1 GB of bandwidth a month, and they change
# only when a source document is replaced. After touching data/pdf/,
# data/sources.yaml or a manifest, run it from the Actions tab.

on:
  schedule:
    # 06:17 UTC on the 1st, off the hour. Schedules run only from the default
    # branch, and GitHub disables them after 60 days without a commit;
    # workflow_dispatch covers both.
    - cron: "17 6 1 * *"
  workflow_dispatch:

# Read-only (byob-security.5).
permissions:
  contents: read

# A dispatch on top of a scheduled run supersedes it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify-full:
    name: source PDFs match both records
    runs-on: ubuntu-latest
    steps:
      # The one checkout that fetches LFS for real.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # ~67 MB, once a month; see the header note.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Fail here, by name, if the checkout left LFS pointers (`-` in
      # `git lfs ls-files`), rather than as an ERROR inside verify.
      - name: Check the PDFs are real files and not LFS pointers
        run: |
          if git lfs ls-files | grep -q '^[0-9a-f]* - '; then
            echo "data/pdf/ checked out as Git LFS pointers, not PDFs." >&2
            echo "This workflow must not inherit GIT_LFS_SKIP_SMUDGE and its" >&2
            echo "checkout must set 'lfs: true'; see the header note." >&2
            git lfs ls-files >&2
            exit 1
          fi
          git lfs ls-files
      # --full adds one check to ci.yml's run: source-pdfs-match-both-records.
      - name: Hash the source PDFs against both records
        run: ./bin/fisc verify --full --strict
