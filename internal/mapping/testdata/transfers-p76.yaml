          # DOLLARS, because negatives are parenthesised in these documents.
          # Nothing downstream sees that value only because the column is
          # skipped.
          - {skip: true}
    rows:
      - {label: "Transfer From General Fund             to Stormwater", category: "transfers/in"}
      - {label: "Transfer From Wastewater               to Stormwater", category: "transfers/in"}
      - {label: "to Wastewater Replacement", category: "transfers/in"}
      - {label: "Transfer From Wastewater               to LAVWMA / Wastewater", category: "transfers/in"}

  - id: p76-transfers-in-enterprise-b
