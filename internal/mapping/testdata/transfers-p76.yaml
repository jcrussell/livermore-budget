      rules. That is fisc-0cs, on a page outside the department schedules.
    parts:
      - page: 76
        section: "Enterprise Funds"
        stop_at: "Connection"
        columns:
          - {fund_group: enterprise, fiscal_year: 2024, basis: actual}
          - {fund_group: enterprise, fiscal_year: 2025, basis: revised}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
          # The footnote marker. It is not a column and the page prints no
          # header over it, but it sits between this row's last figure and the
          # next row label, where checkGap refuses anything that is not
          # whitespace. A skipped column is the only channel the schema has for
