# Budget Book p76, "SUMMARY OF TRANSFERS" -- a RECONCILIATION fixture, not a
# published mapping. It lives here and not in mappings/ on purpose: resolving it
# proves what the page says, and nothing it produces is exported (fisc-5gk.3).
#
# ROW IDENTITY HERE IS TWO PRINTED FIELDS. A row on this page names a source
# fund and a destination fund with an arbitrary run of spaces between them:
#
#   Transfer From Low Income Hsng          to General Fund   257,012 ...
#   Transfer From Home Grant               to General Fund     8,932 ...
#
# Neither field alone identifies a row -- nine rows here share "to General
# Fund", and "Transfer From General Fund" appears against several destinations.
# Every label below therefore carries `label` and `label_tail`, the row's two
# published anchors, and says NOTHING about the gap between them (fisc-ffy).
#
# It used to spell that gap out: one label embedded ten spaces, the next
# fifteen, because Row carried a single Label matched as one substring and
# there was no other way to name the row. That was the kerning of one release
# written into a rule file, which testdata/spine.yaml's doctrine forbids ("an
# anchor may not assume single spacing"), and it is gone.
#
# The gap is still CHECKED, which is what makes this a two-anchor match rather
# than a wildcard: only whitespace may separate the anchors, so a pair that
# matched across a row boundary fails rather than filing one row's figures
# under another row's identity.
#
# WHAT THE PAGE IS. 22 transfers, grouped by the fund group RECEIVING the money,
# four columns each (FY23-24 actual, FY24-25 revised, and the two budget years),
# and ONE grand total for the whole page rather than one per section -- which is
# why the reconciliation sums across these six rules in Go rather than declaring
# a total_row here.
#
# Three rows carry no source: their "Transfer From" continues from the row
# above, so the label is the destination alone. That is the document own
# shorthand, not a wrapped line.
schema_version: 1
doc_id: livermore-budget-fy2026-2027

rules:
  - id: p76-transfers-in-general
    kind: transfer_in
    basis: adopted
    scope: all-funds-gross
    units: dollars
    note: >-
      Nine transfers into the General Fund. The section anchor carries its
      trailing newline because "General Fund" also ends every one of these
      nine row labels: without it the anchor matches a data row rather than
      the section header.
    parts:
      - page: 76
        section: "General Fund\n"
        section_ordinal: 1
        stop_at: "Enterprise Funds"
        # The page prints four year headers on one line (p0076.txt:9) and
        # nothing over the footnote-marker column, which is what the trailing
        # null says. Declaring these opts this part into the column guard --
        # the reason the fixture carries them is that the published rule will,
        # and the guard has never run on this page before (fisc-wfi).
        column_headers: ["FY 2023-24", "FY 2024-25", "FY 2025-26", "FY 2026-27", ~]
        columns:
          - {fund_group: general, fiscal_year: 2024, basis: actual}
          - {fund_group: general, fiscal_year: 2025, basis: revised}
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          # The footnote marker. It is not a column and the page prints no
          # header over it, but it sits between this row's last figure and the
          # next row label, where checkGap refuses anything that is not
          # whitespace. A skipped column is the only channel the schema has for
          # "present in the text, produces nothing" -- and it is load-bearing
          # here in a second way: amount.Parse reads "(10)" as NEGATIVE TEN
          # DOLLARS, because negatives are parenthesised in these documents.
          # Nothing downstream sees that value only because the column is
          # skipped.
          - {skip: true}
    rows:
      - {label: "Transfer From Low Income Hsng", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From Home Grant", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From State Grant", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From Downtown Revital", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From CASP Fee", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From Downtown LMD", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From Other LMDs", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From Traffic Imp Fee", label_tail: "to General Fund", category: "transfers/in"}
      - {label: "Transfer From State Gas Tax", label_tail: "to General Fund", category: "transfers/in"}

