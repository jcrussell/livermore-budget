    basis: adopted
    scope: all-funds-gross
    units: dollars
    note: >-
      The rest of the Enterprise section, resumed after the wrapped label.
      Anchoring ON the fragment is what makes the split visible rather than
      silent: if the city re-typesets that row onto one line, this anchor
