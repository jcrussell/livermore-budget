          - {skip: true}
    rows:
      - {label: "Transfer From General Fund", label_tail: "to Stormwater", category: "transfers/in"}
      - {label: "Transfer From Wastewater", label_tail: "to Stormwater", category: "transfers/in"}
      - {label: "to Wastewater Replacement", category: "transfers/in"}
      - {label: "Transfer From Wastewater", label_tail: "to LAVWMA / Wastewater", category: "transfers/in"}

