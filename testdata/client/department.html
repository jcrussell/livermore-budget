<!doctype html>
<!-- The DOM site/department.js and site/theme.js bind on department.html,
     held to schema/bindings.json; no prose. testlib fills the config. -->
<html lang="en">
<head><meta charset="utf-8"><title>department</title>
<script type="application/json" id="department-config"></script>
</head>
<body>
<nav class="site-nav" aria-label="Views">
  <button type="button" id="nav-toggle" aria-expanded="false" aria-controls="nav-views" hidden>Menu <span class="nav-here">Departments</span></button>
  <ul id="nav-views">
    <li><a href="index.html" data-years="fy2026-adopted fy2027-adopted">At a glance</a></li>
    <li><a href="flows.html" data-years="fy2026-adopted fy2027-adopted">Flows</a></li>
    <li><a href="ledger.html" data-years="fy2026-adopted fy2027-adopted">Bars</a></li>
    <li><a href="change.html">Over time</a></li>
    <li><a href="balances.html">Fund balances</a></li>
    <li><span aria-current="page">Departments</span></li>
    <li><a href="capital.html" data-years="fy2026-adopted fy2027-adopted fy2028-projected fy2029-projected fy2030-projected">Capital projects</a></li>
    <li><a href="debt.html">Debt</a></li>
    <li><a href="caveats.html">Caveats</a></li>
    <li><a href="provenance.html">Sources and data</a></li>
  </ul>
  <button type="button" id="theme-toggle" hidden>Dark mode</button>
</nav>
<template id="lede-more"><button type="button" class="lede-more">More</button></template>
<div class="year-bar">
  <label class="year-select">Budget year
    <select id="year-select" disabled>
      <option value="fy2024-actual">FY 2023-24 actual</option>
      <option value="fy2025-revised">FY 2024-25 revised</option>
      <option value="fy2026-adopted">FY 2025-26 adopted</option>
      <option value="fy2027-adopted" selected>FY 2026-27 adopted</option>
    </select>
  </label>
</div>
<header class="page-head"><div><h1>Departments</h1><p class="lede">Lede.</p></div></header>
<main id="department-main">
<section class="department-bars" aria-labelledby="bars-heading">
  <h2 id="bars-heading">Every department</h2>
  <details class="how-to-read" open><summary>How to read</summary><p>How.</p></details>
  <ul class="department-legend" id="department-legend"></ul>
  <ol class="department-list" id="department-list"></ol>
</section>
<div class="department-view" id="department-view">
<h3 id="department-heading">Choose a department</h3>
<p class="department-tie" id="department-tie" data-ties="TIES." data-held="HELD: "></p>
<div class="department-sides">
<section class="sides-side department-side" data-side="funding" aria-labelledby="funding-heading">
  <h4 id="funding-heading">Funding</h4>
  <p class="sides-total subtle"></p>
  <figure class="sides-figure" hidden></figure>
</section>
<section class="sides-side department-side" data-side="spending" aria-labelledby="spending-heading">
  <h4 id="spending-heading">Spending</h4>
  <p id="transfers-says" hidden>Transfers.</p>
  <p class="sides-total subtle"></p>
  <figure class="sides-figure" hidden></figure>
</section>
</div>
</div>
<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
</main>
<template id="department-bar"><li class="department-bar"><div class="department-row" role="button" tabindex="0" aria-expanded="false"><span class="department-name"></span><span class="department-track"></span><span class="department-value"></span></div><div class="department-detail" hidden><ul class="department-groups"></ul><a class="department-to-sides" href="#department-heading">Below</a></div></li></template>
<template id="department-seg"><span class="department-seg"></span></template>
<template id="department-key"><li><span class="department-swatch" aria-hidden="true"></span><span class="department-key-name"></span></li></template>
<template id="ledger-list"><ol class="ledger-list"></ol></template>
<template id="ledger-row"><li class="bar-row" tabindex="0" role="button"><span class="bar-label"></span><span class="bar-track"><span class="bar-fill"></span></span><span class="bar-value"></span><span class="bar-share subtle"></span></li></template>
<template id="department-group"><li><span class="department-swatch" aria-hidden="true"></span><span class="department-group-name"></span><span class="department-group-value"></span><span class="department-group-share"></span></li></template>
</body>
</html>
