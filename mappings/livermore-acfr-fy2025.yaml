  - id: acfr-p0167-other-governmental-fund-balances
    kind: fund_balance
    basis: audited
    scope: acfr-fund-balances
    units: dollars
    total_row: "Total all other governmental funds"
    note: >-
      p167's second block, All Other Governmental Funds: four components (the
      page prints no Assigned row here) tying to the printed total exactly in
      every column. The columns carry NO fund_group, which is the page rather
      than an omission: the aggregate spans special-revenue, debt-service and
      capital funds, and naming any one type would file the others' balances
      under it. The two blocks print identical row labels, so a rule resolved
      against the wrong section is caught by shape, not by luck: this rule
      read against the General Fund block trips checkGap on the unmapped
      Assigned row (pinned in acfr_changes_test.go).
    parts:
      - page: 167
        section: "All Other Governmental Funds"
        stop_at: "Total all other governmental funds"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "Nonspendable", category: fund-balance/nonspendable}
      - {label: "Restricted", category: fund-balance/restricted}
      - {label: "Committed", category: fund-balance/committed}
      - {label: "Unassigned", category: fund-balance/unassigned}

