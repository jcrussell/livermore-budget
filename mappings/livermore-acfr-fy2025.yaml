  # --------------------------------------------------------------------------
  - id: acfr-p0121-gf-budget-other-financing-sources
    kind: transfer_in
    basis: actual
    scope: acfr-general-fund-budget-actual
    grain: category
    units: dollars
    total_row: "Total Other Financing Sources (Uses)"
