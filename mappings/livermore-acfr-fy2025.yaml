  - id: acfr-p0168-expenditures
    kind: expenditure
    basis: audited
    scope: acfr-changes-in-fund-balances
    units: dollars
    total_row: "Total Expenditures"
    note: >-
      p168's expenditure block: the ACFR's function axis (data/taxonomy.yaml's
      function categories), twelve lines tying to the printed Total
      Expenditures exactly in every column. Redevelopment prints a dash in all
      ten years -- a line that exists and is zero, published as such. The
      three debt-service lines share the debt-services category and are told
      apart by row_label, the taxonomy's doctrine for detail lines; the first
      of them is a two-anchor row because the page prints the group label
      "Debt service funds:" on its own line directly above "Principal".
    parts:
      - page: 168
        # The block heading; the second occurrence is inside "Total
        # Expenditures".
        section: "Expenditures"
        section_ordinal: 1
        stop_at: "Total Expenditures"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "General government", category: general-government}
      - {label: "Fire", category: fire}
      - {label: "Police", category: police}
      - {label: "Public Works", category: public-works}
      - {label: "Community Development", category: community-development}
      - {label: "Economic Development", category: economic-development}
      - {label: "Library", category: library-function}
      - {label: "Redevelopment", category: redevelopment}
      - {label: "Capital outlay", category: capital-outlay}
      - {label: "Debt service funds:", label_tail: "Principal", category: debt-services}
      - {label: "Interest and fiscal charges", category: debt-services}
