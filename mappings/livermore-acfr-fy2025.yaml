# City of Livermore, FY 2024-25 Annual Comprehensive Financial Report.
#
# p41, "General Fund / Statement of Revenues, Expenditures And Changes In Fund
# Balances (in Millions)": the ten revenue rows (tie to Total Revenues 157.20
# exactly), the two Other Financing Sources rows (tie to (25.19) exactly), the
# five General Government divisions (tie to the 18.45 printed ABOVE them, within
# a tolerance the page's printed precision derives), and the three fund-balance
# lines (asserted by fund-balance-identity).
#
# The rest of p41's expenditure block is not mapped: its rows are DEPARTMENTS and
# fact-departments-resolve accepts division slugs only (fisc-xudn). The General
# Government rows carry no department: two of the five name departments covering
# several divisions (data/taxonomy.yaml's general-government entry).
#
# p41's FY2024 column is skip: true. Three of the page's four printed blocks
# (revenue, expenditure, Other Financing Sources, fund balances) miss in it, in
# printed units of $10,000:
#
#   revenue                 145.70 against 145.50   miss 0.20  (20 units)
#   expenditure, top level  122.80 against 122.90   miss 0.10  (10 units)
#   Other Financing Sources (13.80) against (13.80) TIES
#   fund balances            92.00 against  92.10   miss 0.10  (10 units)
#   General Government sub   15.83 against  16.00   miss 0.17  (17 units)
#
# General Government is a sub-block of the expenditure block, not one of the
# four.
#
# UNITS. "(in Millions)" with two printed decimals: the least significant digit
# is $10,000, not $1,000,000.
#
# p41 has no column_headers: the headers are bare years, which the parser
# refuses, and the stray "0.0" sits 0.32pt below the Miscellaneous baseline, so
# -bbox gives 51 lines against -layout's 52 and the pairing refuses. The printed
# totals are the only column guard here. On General Government the measured
# window is a row two units ($20,000) too low fails, four units too high fails,
# three too high still ties.
#
# SIGN. The ACFR prints Transfers (out) parenthesised; the Budget Book prints
# transfers out as positive magnitudes. Those rows declare `sign: netted`
# (fisc-fdxx), which fact-transfer-orientation-is-declared requires.
schema_version: 1
doc_id: livermore-acfr-fy2025

rules:
  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-other-financing-sources
    kind: transfer_in
    basis: audited
    scope: acfr-general-fund-summary
    grain: fund-group-by-category
    units: millions
    total_row: "Total Other Financing Sources (Uses)"
    note: >-
      The General Fund's two transfer lines for FY2024-25, tying exactly:
      0.53 + (25.72) = (25.19). No total_row_kinds: the printed total covers
      both kinds.
    parts:
      - page: 41
        # The heading recurs as the tail of the total three lines below.
        section: "Other Financing Sources (Uses)"
        section_ordinal: 1
        stop_at: "Total Other Financing Sources (Uses)"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Transfers in", category: transfers/in}
      - {label: "Transfers (out)", category: transfers/out, kind: transfer_out, sign: netted}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-fund-balances
    kind: fund_balance
    basis: audited
    scope: acfr-general-fund-summary
    grain: fund-group-by-category
    units: millions
    note: >-
      The three fund-balance lines the statement closes with. THIS RULE
      DECLARES NO total_row AND THE PAGE PRINTS NONE FOR IT -- a fund balance is
      a stock and the page never adds these three together, so parts_unchecked
      grows by one and that is the honest state rather than a missing
      declaration. What DOES assert them is the fund-balance-identity check:
      92.10 + (5.00) = 87.10, the same identity it asserts over the Budget
      Book's twelve spine cells.

      The three fund-balance lines the statement closes with. No total_row: a
      fund balance is a stock and the page never adds these together;
      fund-balance-identity asserts 92.10 + (5.00) = 87.10.

      The three Other Financing Sources rows are skip: true so the read can
      cross them. Un-skipping a transfer row cites one printed figure twice and
      fact-citations-are-declared refuses it; un-skipping the total publishes
      the stated (25.19) and fact-offset-is-not-a-stated-total refuses it.
    parts:
      - page: 41
        section: "Other Financing Sources (Uses)"
        section_ordinal: 1
        # Only the page number "15" follows the block, and a stop_at may not be
        # a figure; the blank line is the only boundary.
        stop_at: "\n\n"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Transfers in", skip: true}
      - {label: "Transfers (out)", skip: true}
      - {label: "Total Other Financing Sources (Uses)", skip: true}
      - {label: "Net Change in Fund Balances", category: fund-balance/change}
      - {label: "Fund Balances- Beginning, as restated", category: fund-balance/beginning}
      - {label: "Fund Balances- Ending", category: fund-balance/ending}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-revenues
    kind: revenue
    basis: audited
    scope: acfr-general-fund-summary
    grain: fund-group-by-category
    units: millions
    total_row: "Total Revenues"
    note: >-
      The General Fund's ten revenue lines for FY2024-25, tying to the printed
      Total Revenues of 157.20 exactly, so no printed_decimals. The orphan
      "0.0" is declared unmapped_text, not wrapped_labels: the parser refuses a
      wrapped label that amount.Parse accepts (fisc-hcus).
    parts:
      - page: 41
        # The first "Revenues" is inside the page title.
        section: "Revenues"
        section_ordinal: 2
        stop_at: "Total Revenues"
        unmapped_text:
          - text: "0.0"
            note: >-
              A bare figure in the FY2024 column between the Miscellaneous row
              and the printed total, belonging to no row label. It is in the
              skipped column and parses as zero, so only the staleness arm
              stands over this declaration.
        columns:
          - {fund_group: general, fiscal_year: 2025}
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Property taxes and special assessments", category: taxes/property}
      - {label: "Sales Taxes", category: taxes/sales}
      - {label: "Other taxes", category: taxes/other}
      - {label: "Licenses and permits", category: licenses-and-permits}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Contributions from outside sources", category: contributions-outsourced}
      - {label: "Fines and forfeitures", category: fines-and-forfeitures}
      - {label: "Charges for current services", category: charges-for-services}
      - {label: "Use of money and property", category: use-of-money-and-property}
      - {label: "Miscellaneous", category: miscellaneous-revenue}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-general-government
    kind: expenditure
    basis: audited
    scope: acfr-general-fund-summary
    grain: fund-group-by-category
    units: millions
    printed_decimals: 2
    total_row: "General Government:"
    total_row_above: true
    note: >-
      The corpus's only document-derived tolerance: the five divisions print
      0.22 + 5.30 + 2.66 + 7.39 + 2.87 = 18.44 against a printed 18.45, one
      $10,000 unit over five rows, within half a unit per row (fisc-1wr.2).
      The subtotal is printed ABOVE its rows, hence total_row_above, which pins
      the total to the section anchor's own line (fisc-h96o). No row carries a
      department: see data/taxonomy.yaml's general-government entry.
    parts:
      - page: 41
        # The section anchor IS the total_row, as total_row_above requires.
        section: "General Government:"
        # The next top-level function; stop_at is a first-match search
        # (fisc-km5n), and an early stop fails the row-label and total checks.
        stop_at: "Fire"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "City Council", category: general-government}
      - {label: "City Manager", category: general-government}
      - {label: "City Attorney", category: general-government}
      - {label: "Administrative Services", category: general-government}
      - {label: "General Services", category: general-government}

  # --------------------------------------------------------------------------
  - id: acfr-p0177-debt-by-type
    kind: fund_balance
    basis: audited
    scope: acfr-debt-by-type
    units: dollars
    note: >-
      p177, Ratios of Outstanding Debt by Type, read and publishing nothing.
      Col 9 prints "2.5%", which amount.Parse rejects, and col 10 "$ 1,009"
      per capita, which it accepts; the quantity declarations keep both out of
      the store of city money (fisc-54vn). The amount columns cannot be facts
      yet: the year is in the row label (fisc-xmh2) and no vocab.Kind states
      outstanding debt (fisc-7jtl); the kind above is inert. Cols 1-7 sum to
      col 8 per row except 2024, short by its Financed Purchases cell,
      176,292; internal/mapping/acfr_p177_test.go guards the arithmetic.
      column_headers are possible (TestACFRDebtPageCarriesTheColumnGuard) and
      fisc-hn90 declares them.
    parts:
      - page: 177
        # The last word of the column-header block; the year rows follow.
        section: "Capita"
        stop_at: "Note:"
        columns:
          - {skip: true} # Governmental: Certificates of Participation
          - {skip: true} # Governmental: Notes & Loans Payable
          - {skip: true} # Governmental: Financed Purchases and SBITA
          - {skip: true} # Business-Type: Certificates of Participation
          - {skip: true} # Business-Type: Financed Purchases
          - {skip: true} # Business-Type: State Loan
          - {skip: true} # Business-Type: Financed Purchases and SBITA
          - {skip: true} # Total Primary Government
          - {quantity: percentage} # Percentage of Personal Income (1)
          - {quantity: amount_per_unit} # Per Capita
    rows:
      - {label: "2016", skip: true}
      - {label: "2017", skip: true}
      - {label: "2018", skip: true}
      - {label: "2019", skip: true}
      - {label: "2020", skip: true}
      - {label: "2021", skip: true}
      - {label: "2022", skip: true}
      - {label: "2023", skip: true}
      - {label: "2024", skip: true}
      - {label: "2025", skip: true}

  # --------------------------------------------------------------------------
  - id: acfr-p0167-general-fund-balances
    kind: fund_balance
    basis: audited
    scope: acfr-fund-balances
    grain: fund-group-by-category
    units: dollars
    total_row: "Total general fund"
    note: >-
      p167, Fund Balances of Governmental Funds, General Fund block: five GASB
      54 components over ten years, tying to Total general fund exactly in
      every column. The bare-year headers refuse column_headers (fisc-wiyg), so
      the printed total is the only column guard. The totals line prints a
      detached "$" per column, which amountRun drops.
    parts:
      - page: 167
        section: "General Fund"
        stop_at: "Total general fund"
        columns:
          - {fund_group: general, fiscal_year: 2016}
          - {fund_group: general, fiscal_year: 2017}
          - {fund_group: general, fiscal_year: 2018}
          - {fund_group: general, fiscal_year: 2019}
          - {fund_group: general, fiscal_year: 2020}
          - {fund_group: general, fiscal_year: 2021}
          - {fund_group: general, fiscal_year: 2022}
          - {fund_group: general, fiscal_year: 2023}
          - {fund_group: general, fiscal_year: 2024}
          - {fund_group: general, fiscal_year: 2025}
    rows:
      - {label: "Nonspendable", category: fund-balance/nonspendable}
      - {label: "Restricted", category: fund-balance/restricted}
      - {label: "Committed", category: fund-balance/committed}
      - {label: "Assigned", category: fund-balance/assigned}
      - {label: "Unassigned", category: fund-balance/unassigned}

  # --------------------------------------------------------------------------
  - id: acfr-p0167-other-governmental-fund-balances
    kind: fund_balance
    basis: audited
    scope: acfr-fund-balances
    grain: category
    units: dollars
    total_row: "Total all other governmental funds"
    note: >-
      p167's All Other Governmental Funds block: four components (no Assigned
      row) tying exactly in every column. No fund_group: the aggregate spans
      several fund types. Read against the General Fund block this rule trips
      checkGap on Assigned (acfr_changes_test.go).
    parts:
      - page: 167
        section: "All Other Governmental Funds"
        stop_at: "Total all other governmental funds"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "Nonspendable", category: fund-balance/nonspendable}
      - {label: "Restricted", category: fund-balance/restricted}
      - {label: "Committed", category: fund-balance/committed}
      - {label: "Unassigned", category: fund-balance/unassigned}

  # --------------------------------------------------------------------------
  - id: acfr-p0168-revenues
    kind: revenue
    basis: audited
    scope: acfr-changes-in-fund-balances
    grain: category
    units: dollars
    total_row: "Total revenues"
    note: >-
      p168, Changes in Fund Balances, revenue block: nine lines over ten years,
      all governmental funds (no fund_group), tying to Total revenues exactly
      in every column; bare-year headers refuse the geometry guard
      (fisc-wiyg).
    parts:
      - page: 168
        # The second "Revenues" is inside "Excess of Revenues".
        section: "Revenues"
        section_ordinal: 1
        stop_at: "Total revenues"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      # "(1)" is the page's footnote marker, printed in the label.
      - {label: "Property Taxes and special assessments (1)", category: taxes/property}
      - {label: "Sales taxes", category: taxes/sales}
      - {label: "Licenses and permits", category: licenses-and-permits}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Contributions from outside sources", category: contributions-outsourced}
      - {label: "Fines and forfeitures", category: fines-and-forfeitures}
      - {label: "Charges for current services", category: charges-for-services}
      - {label: "Use of money and property", category: use-of-money-and-property}
      - {label: "Miscellaneous", category: miscellaneous-revenue}

  # --------------------------------------------------------------------------
  - id: acfr-p0168-expenditures
    kind: expenditure
    basis: audited
    scope: acfr-changes-in-fund-balances
    grain: category
    units: dollars
    total_row: "Total Expenditures"
    note: >-
      p168's expenditure block on the ACFR's function axis, twelve lines tying
      to Total Expenditures exactly in every column. Redevelopment prints a
      dash in all ten years. The three debt-service lines share a category and
      differ by row_label; "Debt service funds:" prints on its own line above
      "Principal", hence the two-anchor row.
    parts:
      - page: 168
        # The second "Expenditures" is inside the total's label.
        section: "Expenditures"
        section_ordinal: 1
        stop_at: "Total Expenditures"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "General government", category: general-government}
      - {label: "Fire", category: fire}
      - {label: "Police", category: police}
      - {label: "Public Works", category: public-works-function}
      - {label: "Community Development", category: community-development-function}
      - {label: "Economic Development", category: economic-development}
      - {label: "Library", category: library-function}
      - {label: "Redevelopment", category: redevelopment}
      - {label: "Capital outlay", category: capital-outlay}
      - {label: "Debt service funds:", label_tail: "Principal", category: debt-services}
      - {label: "Interest and fiscal charges", category: debt-services}
      - {label: "Issuance cost", category: debt-services}

  # --------------------------------------------------------------------------
  - id: acfr-p0168-excess-of-revenues
    kind: fund_balance
    basis: audited
    scope: acfr-changes-in-fund-balances
    grain: category
    units: dollars
    note: >-
      The statement's subtotal Excess of Revenues over (under) expenditures,
      its label wrapped over three lines. One printed line, so no total_row;
      excess-of-revenues-identity asserts revenues less expenditures equals it
      in every column.
    parts:
      - page: 168
        section: "Excess of Revenues"
        # A stop_at may not be a figure, and "(1)" alone parses as one.
        stop_at: "(1) VLF"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "over (under)", label_tail: "expenditures", category: fund-balance/excess-of-revenues}

  # --------------------------------------------------------------------------
  - id: acfr-p0169-other-financing
    kind: transfer_in
    basis: audited
    scope: acfr-changes-in-fund-balances
    units: dollars
    note: >-
      p169, Other Financing Sources (Uses) and the two lines that close it,
      read whole and publishing nothing (fisc-qyrw). The block's 2023 total
      prints (1,767,367), a copy of 2022, against components summing to
      39,259,064, so it cannot be a total_row; Net change 2023 is the same
      copy. The kind above is inert while every row is skipped. The last row
      is the whole-row quantity channel's real-page consumer
      (acfr_changes_test.go).
    parts:
      - page: 169
        # The second line of the block heading; the total row prints the same
        # words in lower case.
        section: "Sources (Uses)"
        # Only the page number follows the block; the blank line below the
        # last row is the only boundary left, as on p41's fund-balance rule.
        stop_at: "\n\n"
        wrapped_labels: ["Debt service as a"]
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "Proceeds from long term debt", skip: true}
      - {label: "Payment to refunded bond escrow agent", skip: true}
      - {label: "Refunding bonds issued", skip: true}
      - {label: "Premium on refunding bonds issued", skip: true}
      - {label: "Transfers in", skip: true}
      - {label: "Transfers out", skip: true}
      - {label: "Total other financing", label_tail: "sources (uses)", skip: true}
      - {label: "Net change in", label_tail: "fund balances", skip: true}
      - {label: "percentage of noncapital", label_tail: "expenditures", quantity: percentage}

  # --------------------------------------------------------------------------
  # p121, the General Fund's budgetary comparison for FY2024-25, one rule per
  # printed block. Variance is skipped: a difference of two published figures.
  # Actual is basis actual (RSI, budgetary basis, where p41 is GAAP). No column
  # names fund group `general`: that would repeat p41's series (fisc-i1bs), and
  # these are not fund 100's figures either.
  - id: acfr-p0121-gf-budget-revenues
    kind: revenue
    basis: actual
    scope: acfr-general-fund-budget-actual
    grain: category
    units: dollars
    total_row: "Total Revenues"
    note: >-
      The nine revenue lines, tying to the printed Total Revenues in the
      three columns read. The page prints no Contributions from outside
      sources line, where p41 prints one with a dash for FY2024-25.
    parts:
      - page: 121
        # "REVENUES" first occurs inside the page title, "SCHEDULE OF
        # REVENUES, EXPENDITURES AND CHANGES IN FUND BALANCES".
        section: "REVENUES"
        section_ordinal: 2
        stop_at: "Total Revenues"
        column_headers: ["Original", "Final", "Budgetary Basis", "(Negative)"]
        columns:
          - {fiscal_year: 2025, basis: adopted}
          - {fiscal_year: 2025, basis: revised}
          - {fiscal_year: 2025, basis: actual}
          - {fiscal_year: 2025, skip: true}
    rows:
      - {label: "Property taxes", category: taxes/property}
      - {label: "Sales taxes", category: taxes/sales}
      - {label: "Other taxes", category: taxes/other}
      - {label: "Licenses and permits", category: licenses-and-permits}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Fines and forfeitures", category: fines-and-forfeitures}
      - {label: "Charges for current services", category: charges-for-services}
      - {label: "Use of money and property", category: use-of-money-and-property}
      - {label: "Miscellaneous", category: miscellaneous-revenue}

  # --------------------------------------------------------------------------
  - id: acfr-p0121-gf-budget-expenditures
    kind: expenditure
    basis: actual
    scope: acfr-general-fund-budget-actual
    grain: category
    units: dollars
    total_row: "Total Expenditurs"
    note: >-
      The fourteen expenditure lines on the ACFR's function axis, tying to the
