  # --------------------------------------------------------------------------
  - id: acfr-p0168-excess-of-revenues
    kind: fund_balance
    basis: audited
    scope: acfr-changes-in-fund-balances
    units: dollars
    note: >-
      The statement's own subtotal, Excess of Revenues over (under)
      expenditures. The page wraps the label over three lines, so the section
      anchor is its first fragment and the row's two anchors are the second
      and third. NO total_row -- this is one printed line -- and what asserts
      it instead is excess-of-revenues-identity (internal/check): total
      revenues minus total expenditures equals this row, per column, measured
      to hold in all ten before the check was written. That is the batch's
      corroboration tie; the cross-table candidates fisc-oakx.3 named were
      measured dead (fisc-y242 and the bead's own notes).
    parts:
      - page: 168
        section: "Excess of Revenues"
        # The footnote line under the block; a stop_at may not be a figure,
        # and "(1)" alone parses as a negative amount.
        stop_at: "(1) VLF"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "over (under)", label_tail: "expenditures", category: fund-balance/excess-of-revenues}

  # --------------------------------------------------------------------------
  - id: acfr-p0169-other-financing
    kind: transfer_in
    basis: audited
    scope: acfr-changes-in-fund-balances
    units: dollars
    note: >-
      p169, the statement's Other Financing Sources (Uses) block and the two
      lines that close it: read whole, publishing nothing yet (fisc-qyrw).
      The block's printed total cannot be a total_row: its 2023 cell prints
      (1,767,367), a copy of 2022, against components summing to 39,259,064
      (41,558,955 of bond proceeds plus 6,672,696 in, less 8,972,587 out) --
      the other nine columns tie -- and a stated_total_delta sized to a copied
      cell would be the fabricated declaration Rule.TotalSpansParts' doc
      comment warns against. Net change in fund balances 2023 is the same
      copy, and publishing it as fund-balance/change would also trip
      fund-balance-identity's completeness arm: no beginning or ending line
      exists at this scope. The kind above is the schema's required field,
      inert while every row is skipped. The last row is the whole-row quantity
      channel's real-page consumer: remove its quantity and the read reddens
      on 'cannot parse amount "6.6%"' (acfr_changes_test.go).
    parts:
      - page: 169
        # The second line of the block heading; the total row prints the same
        # words in lower case.
        section: "Sources (Uses)"
        # Only the page number follows the block; the blank line below the
        # last row is the only boundary left, as on p41's fund-balance rule.
        stop_at: "\n\n"
        wrapped_labels: ["Debt service as a"]
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      - {label: "Proceeds from long term debt", skip: true}
      - {label: "Payment to refunded bond escrow agent", skip: true}
      - {label: "Refunding bonds issued", skip: true}
      - {label: "Premium on refunding bonds issued", skip: true}
      - {label: "Transfers in", skip: true}
      - {label: "Transfers out", skip: true}
      - {label: "Total other financing", label_tail: "sources (uses)", skip: true}
      - {label: "Net change in", label_tail: "fund balances", skip: true}
      - {label: "percentage of noncapital", label_tail: "expenditures", quantity: percentage}
