  - id: acfr-p0168-revenues
    kind: revenue
    basis: audited
    scope: acfr-changes-in-fund-balances
    units: dollars
    total_row: "Total revenues"
    note: >-
      p168, Changes in Fund Balances of Governmental Funds, the revenue block:
      nine lines over ten audited years, all governmental funds combined (so
      no fund_group), tying to the printed Total revenues exactly in every
      column. Same guard situation as p167: bare-year headers refuse the
      geometry guard (fisc-wiyg), so the printed total and the
      excess-of-revenues-identity check are what stand over these figures.
    parts:
      - page: 168
        # "Revenues" is the block heading; the second occurrence is inside
        # "Excess of Revenues" further down the page.
        section: "Revenues"
        section_ordinal: 1
        stop_at: "Total revenues"
        columns:
          - {fiscal_year: 2016}
          - {fiscal_year: 2017}
          - {fiscal_year: 2018}
          - {fiscal_year: 2019}
          - {fiscal_year: 2020}
          - {fiscal_year: 2021}
          - {fiscal_year: 2022}
          - {fiscal_year: 2023}
          - {fiscal_year: 2024}
          - {fiscal_year: 2025}
    rows:
      # The "(1)" is the page's own footnote marker, printed as part of the
      # label; the footnote reclassifies VLF Comp from Intergovernmental in
      # FY2024-25.
      - {label: "Property Taxes and special assessments (1)", category: taxes/property}
      - {label: "Sales taxes", category: taxes/sales}
      - {label: "Licenses and permits", category: licenses-and-permits}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Contributions from outside sources", category: contributions-outsourced}
      - {label: "Fines and forfeitures", category: fines-and-forfeitures}
