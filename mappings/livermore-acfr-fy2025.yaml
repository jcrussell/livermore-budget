# City of Livermore, FY 2024-25 Annual Comprehensive Financial Report.
#
# THE SECOND DOCUMENT IN THE CORPUS. Until this file landed, mappings/ held one
# file and the whole fact store was one document's.
#
# WHAT IS MAPPED: PDF page 41, "General Fund / Statement of Revenues,
# Expenditures And Changes In Fund Balances (in Millions)" -- three of its four
# blocks plus the fund-balance lines that close the statement. Twenty figures,
# all FY2024-25 audited:
#
#   - the ten revenue rows, tying to the printed Total Revenues of 157.20
#     exactly;
#   - the two Other Financing Sources rows, tying to the printed (25.19)
#     exactly;
#   - the five divisions of the General Government function, tying to the
#     subtotal of 18.45 printed ABOVE them within the tolerance that page's own
#     printed precision derives;
#   - the three fund-balance lines, asserted by fund-balance-identity rather
#     than by a printed total.
#
# TWO OF THESE ARRIVED LATER THAN THE OTHERS AND EACH NEEDED A MECHANISM, which
# is most of what this file is a record of. An earlier version of this comment
# argued at length for declining both; that argument is kept below rather than
# deleted, because what it got RIGHT about the page is still true and what it
# got wrong is instructive.
#
# (1) THE REVENUE BLOCK IS READ, AND WHAT WAS IN THE WAY WAS ONE ORPHAN FIGURE.
#     p0041.txt line 27 is a bare "0.0" on a line of its own between the
#     Miscellaneous row's figures and the Total Revenues row. It is in the FY2024
#     column and belongs to no printed row label. labelledValues' trailing arm
#     refuses it; stop_at cannot name it, because the parser refuses a block
#     anchor that amount.Parse accepts; an eleventh skip: true row runs off the
#     end of the block on the value count.
#
#     THE FOURTH EXIT WAS OPEN AND DISHONEST, AND CLOSING IT IS HALF OF WHAT
#     fisc-hcus LANDED. This comment used to say that declaring the figure in
#     wrapped_labels "would assert that the page wrapped a LABEL there, which is
#     false" and that there was "no honest declaration for it today". The first
#     half was true and the second was not the whole truth: the DISHONEST
#     declaration worked. Measured before the parser was changed --
#     wrapped_labels: ["0.0"] parsed, resolved all ten rows and tied to the
#     printed total, with fisc verify reporting nothing. An instruction in a
#     comment was the only thing standing there. The parser now refuses a
#     wrapped label that amount.Parse accepts and requires an unmapped_text
#     entry to be one, so the two declarations cannot be substituted for each
#     other in either direction, and the block is published under the one that
#     says what is true.
#
#     THE ORPHAN WAS THE ONLY BLOCKER, which is worth stating because an earlier
#     draft of this comment claimed a second one and was wrong. The first
#     revenue row prints a STANDALONE "$" before each figure ("$       60.42
#     $        57.70"), which looks like fisc-yun -- but fisc-yun is CLOSED and
#     dropCurrencyMarks handles a lone mark in the labelled read, so all ten
#     rows read through it without complaint. The claim came from a bead title
#     rather than from the tree, and what settled it was RUNNING the rule.
#
# (2) THE GENERAL GOVERNMENT SUB-BLOCK IS READ, AND IT IS THIS CORPUS'S ONLY
#     CONSUMER OF A DOCUMENT-DERIVED TOLERANCE (fisc-1wr.2).
#
#     The arithmetic, which the earlier draft got right and which is why this
#     block was worth returning to: the TEN top-level expenditure rows --
#     General Government 18.45, Fire 28.62, Police 48.03, Public Works 9.28,
#     Community Development 19.70, Economic Development 3.72, Library 7.58,
#     Capital Outlay 0.82, Principal 0.79, Interest 0.02 -- sum to 137.01, the
#     printed Total Expenditures exactly. Descend past "General Government:"
#     into its five children and the page gives 137.00 instead, because those
#     five sum to 18.44 against a printed 18.45. The 0.01 belongs to the
#     SUBTOTAL, one level down, and NOT to the total; a rule comparing fourteen
#     leaves against a total the page prints over ten rows would assert an
#     equality the city never states and then need a tolerance to absorb an
#     error it had introduced itself. So this file maps the subtotal against its
#     own five rows and leaves the ten-row total alone.
#
#     WHAT HAD TO CHANGE was that the subtotal is printed ABOVE its rows, and
#     totalAnchor resolved a total_row only in the text AFTER the block --
#     "there is no way to say the total for these rows is printed above them",
#     as this comment used to put it. total_row_above says it (fisc-h96o), and
#     is bounded by requiring the total to BE the section anchor, so it names one
#     printed line at a position the resolver already had to resolve. checkGap's
#     leading arm then skips that one line and refuses every digit after it:
#     move the anchor up to "Current:" and the refusal still fires.
#
#     WHAT IS STILL NOT MAPPED IS THE REST OF THE EXPENDITURE BLOCK, and the old
#     reason stands for it. Its other rows are DEPARTMENTS (Fire, Police, Public
#     Works, Community Development, Economic Development, Library) and
#     fact-departments-resolve accepts DIVISION slugs only; six of
#     data/departments.yaml's eleven departments are not division slugs. That is
#     fisc-xudn, answered (c) for this file as it was for pp.85-125.
#
#     THE FIVE ROWS THAT ARE MAPPED CARRY NO department: EITHER, and the reason
#     is NOT the same one. Three of the five -- City Council, City Attorney,
#     General Services -- are 1:1 with a division and could carry one. Two are
#     not: "Administrative Services" the DEPARTMENT covers three divisions and
#     "City Manager" covers two, so typing the division slug would file a
#     multi-division figure under one division and fact-departments-resolve
#     would PASS on it, the strings coinciding. Three right and two silently
#     wrong is worse than none. See data/taxonomy.yaml's general-government
#     entry.
#
# (3) THE FY2024 COLUMN IS PRESENT AND IS NOT PUBLISHED. The reason is that
#     THREE OF THE PAGE'S FOUR BLOCKS do not
#     reconcile in that column: its ten revenue rows sum to 145.70 against a
#     printed 145.50; its expenditure rows to 122.80 against 122.90, at the top
#     level, so it fails under either reading; and 83.90 + 8.10 = 92.00 against
#     a printed ending balance of 92.10. That is $200,000, $100,000 and $100,000
#     on a page printed to the nearest $10,000 -- twenty, ten and ten printed
#     units, nowhere near the document's own rounding and nothing this file may
#     absorb. The table below repeats these with the sub-block beside them.
#
#     THE FOURTH BLOCK -- Other Financing Sources -- TIES IN BOTH COLUMNS:
#     0.70 + (14.50) = (13.80) in FY2024 exactly as 0.53 + (25.72) = (25.19)
#     does in FY2025. So the prior-year column is not simply broken.
#
#     ONE DEFINITION OF "FOUR BLOCKS", USED EVERYWHERE, and getting this wrong
#     has now cost three separate corrections. THE FOUR ARE THE BLOCKS THE PAGE
#     PRINTS: revenue, expenditure, Other Financing Sources, fund balances.
#     General Government is a SUB-BLOCK, inside the expenditure block, and is
#     not one of the four however convenient it would be to count it as one.
#
#     FY2024, measured off the page, every figure in printed units of $10,000:
#
#       revenue                 145.70 against 145.50   miss 0.20  (20 units)
#       expenditure, top level  122.80 against 122.90   miss 0.10  (10 units)
#       Other Financing Sources (13.80) against (13.80) TIES
#       fund balances            92.00 against  92.10   miss 0.10  (10 units)
#       -- and separately --
#       General Government sub   15.83 against  16.00   miss 0.17  (17 units)
#
#     So three of the four printed blocks miss, the sub-block misses by more
#     than any of them, and nothing here is within reach of a tolerance sized
#     from this page. The document's declared fiscal_years would settle the
#     skip on its own; the arithmetic agrees.
#
#     THE ERRORS, kept because the shape recurs and the last one was mine twice
#     over: the first draft said the page had three blocks and that FY2024
#     reconciled in none of them; the second said the block this file maps ties
#     in both columns, singular, when it mapped two; the third quietly redefined
#     "four" as the four blocks THIS FILE MAPS, which let a review pass "correct"
#     internal/check's 0.10 to the sub-block's 0.17 and a later pass correct it
#     back.
#
#     It is declared skip: true so the column grid still lines up.
#
# UNITS. The caption says "(in Millions)" and the page prints two decimals, so
# the least significant printed digit is 0.01 million = $10,000. amount.Parse
# is given units: millions and converts to integer cents; nothing here is ever
# a float. Note that the UNIT and the CAPTION are different things -- a rule
# that reasoned from the word "Millions" would be reasoning about $1,000,000
# when the page resolves to $10,000.
#
# NO column_headers, AND THAT IS A REAL GAP RATHER THAN AN OMISSION. Every one
# of the 139 parts in the Budget Book's mapping declares them, which opts that
# part into the geometry column-position guard. This page cannot have it, for
# two independent reasons:
#
#   - the printed headers are the bare years "2025" and "2024", and the parser
#     refuses a column_headers entry that amount.Parse accepts (it would be
#     anchoring the grid on a figure);
#   - the geometry/text line pairing fails on this page anyway. The stray "0.0"
#     of (1) sits 0.32pt below the Miscellaneous row's baseline, inside the
#     4.945pt line tolerance, so -bbox clusters it INTO that line while -layout
#     puts it on its own. 51 geometry lines against 52 text lines, and the
#     pairing refuses rather than guessing.
#
# So the only thing standing between these twenty figures and a wrong-column read
# is the printed total each block anchors on, plus the fact that every block here
# is label-anchored rather than positional. Said out loud because
# docs/extraction-substrate.md calls the geometry guard "the designed answer",
# and on this page it is absent.
#
# AND THE GENERAL GOVERNMENT BLOCK IS THE WEAKEST POINT OF THAT, because it is
# the one block whose printed total is reached through a TOLERANCE rather than
# exactly: the widest bound in the corpus standing over the fewest guards. What
# is left holding it is that the bound is half a printed unit per row -- 2.5
# units over five rows -- and the MEASURED thresholds are that a row read two
# units ($20,000) too LOW fails, and one read four units ($40,000) too HIGH
# fails. Three units too high still ties.
#
# THE ASYMMETRY IS NOT A BUG AND IS WORTH UNDERSTANDING BEFORE ANYONE "FIXES"
# IT. The bound is symmetric about zero; the page's own +1 unit sits off centre
# inside it, so the room left is 1.5 units in one direction and 3.5 in the
# other. An earlier version of this paragraph said "misread by three units or
# more still fails", which was wrong in BOTH directions at once, and it was
# wrong because it was reasoned about rather than computed. The window is
# thinner than every other block in this file, and it is why the bound is not
# the worst case: adding the printed total's own half unit, which the arithmetic
# would justify, would widen it to 3 units and buy slack this page cannot
# afford.
#
# A NOTE ON SIGN, because it differs from the Budget Book. The ACFR prints
# Transfers (out) parenthesised -- (25.72) -- because the block sums to a net
# Other Financing Sources (Uses). The Budget Book prints its TRANSFER OUT row as
# a positive magnitude in a uses column. Both are published here exactly as
# printed, which is the invariant, but it means transfer_out facts point
# OPPOSITE WAYS in the two documents, and a consumer summing transfer_out across
# scopes would get nonsense.
#
# The row below therefore declares `sign: netted` (fisc-fdxx), and
# fact-transfer-orientation-is-declared refuses a transfer printed against its
# kind's direction that does not. Removing the declaration makes it red, naming
# this fact. Nothing is re-signed: amount_cents stays -2572000000, exactly the
# figure the page prints.
#
# WHAT THAT DOES AND DOES NOT BUY. Fact.Sign used to read `positive` under BOTH
# conventions, so a consumer had no way to tell them apart; now it can. It still
# does not STOP a consumer summing across conventions -- nothing does, and
# nothing needs to yet, because no projection selects this scope. When one does,
# the check that refuses the mixture has a field to read.
schema_version: 1
doc_id: livermore-acfr-fy2025

rules:
  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-other-financing-sources
    kind: transfer_in
    basis: audited
    scope: acfr-general-fund-summary
    units: millions
    total_row: "Total Other Financing Sources (Uses)"
    note: >-
      The General Fund's two transfer lines for FY2024-25, audited. They tie to
      the block's own printed total exactly: 0.53 + (25.72) = (25.19), at zero
      tolerance. The rule's kind is transfer_in and the second row overrides it
      to transfer_out -- the same shape the Budget Book's mixed fund blocks use,
      and the reason total_row_kinds is NOT declared here is that the printed
      total covers both rows.
    parts:
      - page: 41
        # "Other Financing Sources (Uses)" occurs twice on this page: as the
        # block heading, and as the tail of "Total Other Financing Sources
        # (Uses)" three lines below. The ordinal says which one was read, so a
        # change in the page's shape fails to resolve rather than quietly
        # anchoring on the total.
        section: "Other Financing Sources (Uses)"
        section_ordinal: 1
        stop_at: "Total Other Financing Sources (Uses)"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          # The prior-year column. Present, skipped, and reason (3) above.
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Transfers in", category: transfers/in}
      - {label: "Transfers (out)", category: transfers/out, kind: transfer_out, sign: netted}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-fund-balances
    kind: fund_balance
    basis: audited
    scope: acfr-general-fund-summary
    units: millions
    note: >-
      The three fund-balance lines the statement closes with. THIS RULE
      DECLARES NO total_row AND THE PAGE PRINTS NONE FOR IT -- a fund balance is
      a stock and the page never adds these three together, so parts_unchecked
      grows by one and that is the honest state rather than a missing
      declaration. What DOES assert them is the fund-balance-identity check:
      92.10 + (5.00) = 87.10, the same identity it asserts over the Budget
      Book's twelve spine cells.

      The block starts at the same anchor as the rule above, so the three Other
      Financing Sources lines sit between that anchor and the first row here.
      They are declared skip: true rather than left out: a skipped row consumes
      its position and produces no facts, which is exactly what is wanted, and
      leaving them out would make their figures unexplained text between rows
      and the read would refuse.

      THOSE THREE skip: true FLAGS ARE LOAD-BEARING. TWO OF THE THREE ARE
      GUARDED SINCE fisc-2x7y; THE THIRD IS NOT, AND THE DIFFERENCE IS EXACT.
      "Transfers in" and "Transfers (out)" are rows the sibling rule PUBLISHES,
      so un-skipping one makes two facts cite one printed figure and
      fact-citations-are-declared refuses it. "Total Other Financing Sources
      (Uses)" is that rule's total_row: its figure is consumed as a total and
      cited by no fact, so un-skipping it collides with nothing. Measured --
      un-skipping it with sign: netted publishes the block's own (25.19) as a
      THIRD transfer_out fact, making ACFR transfers/out 25.72 + 25.19, with
      fisc verify at 44 passed, 0 FAILED. Without the sign it goes red, but on
      the ORIENTATION check and not the doubling, which is the
      green-because-the-gate-fired shape and not a guard. Tracked as fisc-eaic.

      MEASURED, not argued: give the "Transfers in" row here a
      category and a matching kind instead of skip, rebuild, and the store
      publishes the page's single printed 0.53 TWICE -- $1,060,000 of ACFR
      transfers/in where the page prints $530,000. That is now one FAILED
      finding from fact-citations-are-declared, naming both rules and the token;
      it used to be zero.

      Every other check stays satisfied under that mutation, which is why the
      new one was needed and why the reasoning is kept: the fact ids differ
      because rule_id is in the hashed tuple, so CheckUniqueIDs sees nothing;
      both facts re-parse and both offsets land on their token, because it IS
      the same printed figure; and no scope-to-scope check applies, since both
      are in one scope. Before fact-citations-are-declared it went red only if
      the row ALSO carried the wrong kind, and then fact-kind-matches-category
      caught the kind rather than the doubling.

      This is fisc-u2v's doubling mechanism inside a single page: two rules over
      one section, one skipping what the other publishes. Do not turn a skip
      here into a published row without reading it -- the guard will refuse it,
      which is the point, not a formality to work around.
    parts:
      - page: 41
        section: "Other Financing Sources (Uses)"
        section_ordinal: 1
        # THE ONLY TEXT AFTER THIS BLOCK IS THE PAGE NUMBER, "15", and the
        # parser refuses a block anchor that amount.Parse accepts -- correctly,
        # since it would be a figure. The blank line below the statement is the
        # only boundary left. This is weaker than every other stop_at in the
        # corpus, which name a printed label; it is used here because the page
        # offers no label to name, and it fails closed in the direction that
        # matters (a block running to the page foot would take the "15" with it
        # and the trailing-text arm would refuse).
        stop_at: "\n\n"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Transfers in", skip: true}
      - {label: "Transfers (out)", skip: true}
      - {label: "Total Other Financing Sources (Uses)", skip: true}
      - {label: "Net Change in Fund Balances", category: fund-balance/change}
      - {label: "Fund Balances- Beginning, as restated", category: fund-balance/beginning}
      - {label: "Fund Balances- Ending", category: fund-balance/ending}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-revenues
    kind: revenue
    basis: audited
    scope: acfr-general-fund-summary
    units: millions
    total_row: "Total Revenues"
    note: >-
      The General Fund's ten revenue lines for FY2024-25, audited. They tie to
      the printed Total Revenues of 157.20 EXACTLY, at zero tolerance, which is
      why this rule declares no printed_decimals: a tolerance no column needs is
      refused, and rightly.

      WHAT KEPT THIS BLOCK UNMAPPED UNTIL NOW was a single orphan figure, and
      the fix is the `unmapped_text` entry below rather than anything about the
      rows. The page prints a bare "0.0" on a line of its own between the
      Miscellaneous row's figures and the total, in the FY2024 column, belonging
      to no printed label. Every exit was closed: the trailing arm refuses it,
      stop_at cannot name a figure, and an eleventh skip row fails the value
      count because the block ends immediately after it.

      THE FOURTH EXIT WAS OPEN AND DISHONEST, which is the part worth recording.
      wrapped_labels: ["0.0"] parsed, resolved all ten rows and tied to the
      printed total with nothing objecting -- measured before the parser was
      changed. That declaration asserts the page wrapped a row's LABEL onto its
      own line, which is false of a figure. The parser now refuses a wrapped
      label that amount.Parse accepts and requires an unmapped_text entry to be
      one, so the two cannot be substituted for each other. fisc-hcus.
    parts:
      - page: 41
        # "Revenues" occurs first inside this page's title line ("Statement of
        # Revenues, Expenditures And Changes In Fund Balances") and second as
        # the block heading. The ordinal says which was read.
        section: "Revenues"
        section_ordinal: 2
        stop_at: "Total Revenues"
        unmapped_text:
          - text: "0.0"
            note: >-
              A bare figure in the FY2024 column between the Miscellaneous row
              and the printed total, belonging to no row label -- an artefact of
              the city's spreadsheet rather than a line of the statement. It is
              in the SKIPPED column and parses as zero, so removing it from the
              read changes no sum and the totals check cannot witness a wrong
              declaration here; the staleness arm is what stands over it. The
              same "0.0" is why this page's geometry pairing fails: -bbox groups
              it into the row above (0.32pt), giving 51 geometry lines against
              -layout's 52.
        columns:
          - {fund_group: general, fiscal_year: 2025}
          # The prior-year column. Present, skipped, and reason (3) above --
          # these ten rows sum to 145.70 against a printed 145.50, twenty
          # printed units.
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "Property taxes and special assessments", category: taxes/property}
      - {label: "Sales Taxes", category: taxes/sales}
      - {label: "Other taxes", category: taxes/other}
      - {label: "Licenses and permits", category: licenses-and-permits}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Contributions from outside sources", category: contributions-outsourced}
      - {label: "Fines and forfeitures", category: fines-and-forfeitures}
      - {label: "Charges for current services", category: charges-for-services}
      - {label: "Use of money and property", category: use-of-money-and-property}
      - {label: "Miscellaneous", category: miscellaneous-revenue}

  # --------------------------------------------------------------------------
  - id: acfr-p0041-gf-general-government
    kind: expenditure
    basis: audited
    scope: acfr-general-fund-summary
    units: millions
    printed_decimals: 2
    total_row: "General Government:"
    total_row_above: true
    note: >-
      THE ONLY DOCUMENT-DERIVED TOLERANCE IN THIS CORPUS, and the page earned it
      rather than the rule choosing it. The five divisions print 0.22 + 5.30 +
      2.66 + 7.39 + 2.87 = 18.44 against a printed subtotal of 18.45. The page
      is captioned "(in Millions)" and prints two decimals, so its least
      significant digit is $10,000 and the discrepancy is exactly one of them
      over five terms: half a unit per row is $25,000 of slack against a $10,000
      error. Read the caption's word instead of the printed digits and the same
      sum would carry $2,500,000 -- which is the mistake Rule.PrintedDecimals
      exists to prevent. fisc-1wr.2.

      TWO GUARDS HAD TO OPEN FOR THIS BLOCK AND NOTHING ELSE DOES. The city
      prints "General Government:" ABOVE its five rows, where every other
      schedule in the corpus prints its total below; totalAnchor searched only
      after the block, and checkGap's leading arm refuses any digit before the
      first row. total_row_above opens both, and only by pinning the total to
      the section anchor's own line -- move the anchor one line up, to
      "Current:", and the leading-gap refusal still fires on this very subtotal.
      fisc-h96o.

      THE EXPOSURE, MEASURED RATHER THAN REASONED ABOUT, because an earlier
      version of this paragraph reasoned about it and got it wrong in both
      directions. The bound is 2.5 units and the page's own discrepancy is +1,
      so the room left is not symmetric: a single row read TWO units ($20,000)
      too low fails, and one read FOUR units ($40,000) too high fails, while
      three too high still ties. So the tolerance absorbs a misread of up to
      three printed digits in one direction and one in the other -- on the one
      page in the corpus with NO geometry column guard, which is the widest
      tolerance standing over the fewest guards. It is doing real work and is
      not a blanket, but the window is wider upward than a reader would guess.

      NO ROW CARRIES A `department:`, and see data/taxonomy.yaml's
      general-government entry for why: two of these five name DEPARTMENTS that
      cover several divisions, and fact-departments-resolve would pass on the
      wrong division because the strings coincide.
    parts:
      - page: 41
        # The section anchor IS the total_row, which is what total_row_above
        # requires and what bounds it: the stated totals are read off this
        # line and the rows begin on the next.
        section: "General Government:"
        # "Fire" is the next top-level function the page prints. It occurs
        # exactly once after the anchor -- asserted by
        # TestACFRp0041GeneralGovernmentStopsAtFire, because Block resolves
        # stop_at with a plain first-match search and no uniqueness guard of
        # its own (fisc-km5n).
        stop_at: "Fire"
        columns:
          - {fund_group: general, fiscal_year: 2025}
          # The prior-year column. Present, skipped, and reason (3) above --
          # these five sum to 15.83 against a printed 16.00, seventeen printed
          # units, which is nothing a tolerance should absorb.
          - {fiscal_year: 2024, skip: true}
    rows:
      - {label: "City Council", category: general-government}
      - {label: "City Manager", category: general-government}
      - {label: "City Attorney", category: general-government}
      - {label: "Administrative Services", category: general-government}
      - {label: "General Services", category: general-government}

  # --------------------------------------------------------------------------
  - id: acfr-p0177-debt-by-type
    kind: fund_balance
    basis: audited
    scope: acfr-debt-by-type
    units: dollars
    note: >-
      p177, Ratios of Outstanding Debt by Type: ten year rows, ten value
      columns, and the page fisc-9tn4 was settled on. The two quantity
      declarations below are what let the rule read it at all -- col 9 prints
      "2.5%", which amount.Parse rejects, and col 10 prints "$ 1,009" per
      capita, which amount.Parse ACCEPTS; the quantity is the only thing
      standing between dollars-per-capita and a store of city money
      (fisc-54vn).

      EVERYTHING HERE IS READ AND NOTHING PUBLISHES, and each skip is a
      measured blocker, not a preference. The eight amount columns cannot be
      facts: the year lives in the ROW label and Fact.FiscalYear has no row
      channel, and the seven debt columns share one (fund_group, fund,
      fiscal_year, basis) identity (fisc-xmh2); no mapping.Kind states
      outstanding debt truthfully (fisc-7jtl) -- the kind above is the
      schema's required field, inert while every row is skipped. When
      publication lands, the page's check lands with it: cols 1-7 sum to col 8
      per row, 2024 short by exactly 176,292, its own Financed Purchases cell
      (fisc-xmh2 carries it). Until then the arithmetic guard is
      internal/mapping/acfr_p177_test.go, which reads the page through THIS
      rule with the skips lifted in memory.

      NO column_headers, MEASURED: the page's footnote "(1)" sits on its own
      -layout line and 2.6pt above its sentence, inside geometry's 4.66pt line
      tolerance, so the substrates disagree 23 lines to 22 and the pairing
      refuses -- p41's failure mode. TestACFRDebtPageCannotCarryTheColumnGuard
      pins it.
    parts:
      - page: 177
        # The last word of the four-line column-header block, printed once on
        # the page; the ten year rows begin on the next line.
        section: "Capita"
        stop_at: "Note:"
        columns:
          - {skip: true} # Governmental: Certificates of Participation
          - {skip: true} # Governmental: Notes & Loans Payable
          - {skip: true} # Governmental: Financed Purchases and SBITA
