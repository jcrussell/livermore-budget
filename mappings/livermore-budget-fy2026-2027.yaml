  # ==========================================================================
  # CAPITAL IMPROVEMENT PROGRAM, PROJECT LISTING BY FUND, pp.224-235.
  #
  # Every CIP project, by the fund paying for it, for FY2024-25 through
  # FY2030-45. The CIP document prints the same listing, but its tables are
  # raster images under an OCR text layer that drops every "-" and splits
  # digits ("25 1,000" for 251,000), so it is read here and not there
  # (fisc-8ln).
  #
  # SIX PAGE PAIRS, ONE RULE EACH. An even page prints fund, project, name and
  # FY2024-25; the odd page after it continues the same lines with the other
  # seven columns and no labels, so it is read positionally against its even
  # page, as p67 is against p66. The label is the fund number, which the page
  # prints first on the line, and the tail is the project number and name.
  #
  # COLUMNS. FY2025-26 and FY2026-27 publish as adopted, and FY2027-28 to
  # FY2029-30 as projected: printed plan figures, not appropriations. Three
  # columns are read and not published: FY2024-25, whose basis nothing on these
  # pages states and whose 59,192,538 total is not p222's FY2024-25 revised
  # 104,665,416; FY2030-45, fifteen years in one figure; and TOTAL, each row's
  # sum.
  # The budget years are not p222's new appropriations either: the listing's
  # totals carry forward unspent appropriations (structure.BudgetBookResidue).
  #
  # SUBTOTALS. Each fund's block ends in a printed total, fund 101's four
  # sub-blocks in a SUBTOTAL each, and p234 in the grand TOTAL. The odd pages
  # print the same lines as figures alone, so no rule boundary can fall
  # between blocks; instead each total is a subtotal row -- 1 for fund 101's
  # sub-blocks, 2 for a fund, 3 for the grand total -- held to the rows above
  # it in every column, the unpublished three included. The six rules are one
  # subtotal_chain because funds 290, 552 and 560 begin on one page pair and
  # are totalled on the next.
  #
  # FUND 611 IS READ AND NOT PUBLISHED. p230 lists its projects twice, under
  # TOTAL - FEDERAL GRANT - STORM and again under TOTAL - STATE GRANT - STORM,
  # on lines identical but for their figures. A fact's identity is its printed
  # row, so the two cannot both publish, and publishing one would understate
  # the fund. Both blocks are skipped rows that their totals still check.
  #
  # The stray "." on p224 below fund 101's total is a mark the page prints
  # between blocks, declared so the read does not refuse it.
  # --------------------------------------------------------------------------
  - id: cip-listing-p0224
    kind: expenditure
    basis: adopted
    scope: cip-project-listing
    grain: fund-by-category
    units: dollars
    subtotal_chain: cip-project-listing-by-fund
    row_labels_are_fund_numbers: true
    parts:
      - page: 224
        section: "FY 2024-25\n"
        stop_at: "BUDGET FY 2025-27"
        wrapped_labels: ["."]
        column_headers: ["FY 2024-25"]
        columns:
          - {skip: true}
      - page: 225
        labels_from: 224
