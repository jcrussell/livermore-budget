  # ==========================================================================
  # DEPARTMENT FUNDING SOURCES, pp. 85-125 (fisc-71j)
  #
  # "DEPARTMENTWIDE EXPENDITURES WITH FUNDING SOURCES": which funds pay for each
  # of eleven departments. The row is a fund and the column a year, so `fund`
  # and `fund_group` sit on the ROW, and fact-funds-resolve checks each pair.
  #
  # ITS OWN SCOPE: summed by fund group the rows give pp.66-67's TOTAL
  # EXPENDITURES to the cent in eleven of twelve cells, so publishing them at
  # all-funds-gross would double the city's expenditure (fisc-u2v). The twelfth
  # is internal-service FY2026-27: these pages and p0183:64, p0075:53, p0205:17,
  # p0209:20, p0061:39 print 26,294,515, p0067 prints 26,544,515 (fisc-av0w);
  # the funding-sources cut carries one named exception for it,
  # p0067-internal-service-is-250000-high-by-fund-group. Doolan Canyon Preserve
  # Endow (470) is `permanent`, has no spine column (fisc-u8o), and is zero in
  # every budget column.
  #
  # ANCHORS. "Department Funding Sources\n": the trailing newline separates the
  # heading from "Total Department Funding Sources". Continuation parts anchor
  # on "FY 2026-27\n", which occurs once per page. No ordinals needed.
  #
  # column_headers are per (doc_id, page) and all-or-none, so a later block on
  # these pages (fisc-7q6) must repeat them byte for byte.
  #
  # A same-type fund substitution moves no sum, so every rule declares
  # `row_labels_name_funds: true` and row-funds-match-their-anchors reads each
  # label against data/funds.yaml (fisc-90fp).
  # ==========================================================================

  # --------------------------------------------------------------------------
  - id: funding-city-council
    kind: expenditure
    basis: adopted
    scope: department-funding-sources
    grain: fund-by-department-by-category
    units: dollars
    total_row: "Total Department Funding Sources"
    row_labels_name_funds: true
    parts:
      - page: 85
        section: "Department Funding Sources\n"
        stop_at: "Total Department Funding Sources"
        column_headers: ["FY 2023-24", "FY 2024-25", "FY 2025-26", "FY 2026-27"]
        columns:
