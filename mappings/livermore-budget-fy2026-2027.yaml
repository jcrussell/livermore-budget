          - {skip: true}
          - {skip: true}
          - {fund_group: permanent, fiscal_year: 2026}
          - {fund_group: permanent, fiscal_year: 2027}
          - {skip: true}
    rows:
      - {label: "Transfer From Open Space", label_tail: "to Doolan Canyon Preserve Endow", category: "transfers/in", fund: 470,
         counterpart: {category: "transfers/out", kind: transfer_out, fund: 300, fund_group: special-revenue}}

