  # ==========================================================================
  # REVENUE SOURCES BY FUND, Budget Book pp.127-140 (fisc-5gk.1, scope
  # revenue-by-fund per fisc-u2v). 79 rules, 231 data rows, 924 facts.
  #
  # BEFORE YOU ADD pp.68-75 TO THIS SCOPE: DON'T. They are per-fund and they
  # carry revenue, so they read like more of the same schedule, and they are a
  # THIRD citywide revenue total that does not agree with the spine.
  #
  # Measured. p0074.txt:52 prints "Total All Funds: $318,509,884 $310,669,663
  # $72,386,884 $701,566,431" -- beginning balance, revenues, transfers in,
  # total sources, confirmed because the first three sum to the fourth exactly.
  # The spine's FY2026-27 revenue, summing the six TOTAL REVENUES: cells on
  # pp.66-67, is 302,443,043. The difference is 8,226,620.
  #
  # The delta is NOT just a different basis, because the transfers column on
  # those same pages reconciles exactly: p74's Transfers In 72,386,884 equals
  # p76's FY2026-27 grand total 21,624,633 plus p0075.txt:58's Transfers Out to
  # CIP 50,762,251. So pp.73-75 and p76 are the same money and agree; it is the
  # REVENUE column that does not.
  #
  # The difference is the CIP funds. p0204.txt prints the same 310,669,663 as
  # Total Operating Budget 282,447,173 (the spine's five non-internal-service
  # groups) + Internal Service 19,995,870 + Capital Improvement Program Funds
  # 8,226,620, and p0208.txt:60 prints that 8,226,620 again. pp.66-67 carry no
  # CIP-fund column, so pp.68-75 include funds the spine does not.
  #
  # cuts-tie-along-the-lattice WOULD catch the over-inclusion -- it requires
  # this scope's per-cell sums to equal the spine's -- but it would surface as a
  # mysterious red check rather than as a known property of the document, which
  # is why this note is here rather than only in the tracker. fisc-zs5.
  # ==========================================================================

