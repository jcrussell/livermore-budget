# City of Livermore, Adopted Budget FY2025-26 / FY2026-27.
#
# THE CITYWIDE SPINE: "CITYWIDE REVENUES, EXPENDITURES, AND FUND BALANCE/WORKING
# CAPITAL", PDF pages 66 and 67, one table six fund groups wide:
#
#   p66  General Fund and Enterprise Funds, WITH row labels.
#   p67  Capital, Debt Service, Special Revenue and Internal Service Funds,
#        with NO row labels; row identity is positional against p66's order,
#        which is what `labels_from: 66` declares.
#
# `fiscal_year` is the ENDING year of the fiscal year, always: the column printed
# "FY 2025-26" is `fiscal_year: 2026`.
#
# ANCHORS. An anchor is a plain substring search over the -layout text.
#   - It may not assume single spacing: p67's header runs differ between its two
#     halves, so those parts anchor on the header's last name plus the newline,
#     "Internal Service Funds\n".
#   - A string that occurs more than once carries a `section_ordinal`.
#   - Every block needs a `stop_at`: the footer's page number is a bare integer
#     amount.Parse reads as a figure, so parts reading to the foot of the
#     schedule stop at "BUDGET FY 2025-27".
#
# COLUMNS. `column_headers` opts a part into the column-position guard. It has
# one entry per COLUMN, skipped ones included, so entries repeat; it is a claim
# about column order; and every part on a page must declare the same list.
#
# A ROW NAMES A PAGE ONLY WHERE ITS TABLE CROSSES A PAGE BREAK, and that page is
# a checked claim about what the city printed, never a way to absorb a pipeline
# defect (fisc-c00).
#
# PADDED BLOCKS. p66 prints the sources and uses runs with nothing between their
# rows, and a block whose header carries digits is refused, so a rule wanting one
# row from the middle declares the whole run and marks the rows it does not own
# `skip: true`.
#
# WHAT TIES. The two rules with a `total_row` reconcile exactly in all 24
# columns; the "$" on a totals row is the `stop_at` for the label-less p67 parts.
# The rules without one are held to TOTAL SOURCES and TOTAL USES, read from
# their padded cells, by fund-group-sources-equal-uses.
schema_version: 1
doc_id: livermore-budget-fy2026-2027

rules:
  # --------------------------------------------------------------------------
  - id: spine-revenues
    kind: revenue
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    total_row: "TOTAL REVENUES:"
    note: >-
      The ten revenue rows of the citywide schedule for all six fund groups,
      p66 labelled and p67 positional, tying exactly to "TOTAL REVENUES:" in all
      12 columns. The scope is all-funds-GROSS: it includes Internal Service
      Fund charges the city bills to itself.
    parts:
      - page: 66
        section: "REVENUES:"
        # The second "REVENUES:" is inside "TOTAL REVENUES:".
        section_ordinal: 1
        stop_at: "TOTAL REVENUES:"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
      - page: 67
        labels_from: 66
        # p67 has no row labels: the block starts after the fourth "FY 2026-27",
        # which ends the header line and fails closed on a fifth fund group.
        section: "FY 2026-27"
        section_ordinal: 4
        # The totals row is the first line whose figures carry "$"; anchoring on
        # the total's value would be circular.
        stop_at: "$"
        # p67 prints all ten revenue rows at p66's y-positions, all-dash rows
        # included; an extractor dropping one is fixed in extraction (fisc-c00).
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27",
                         "FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: capital, fiscal_year: 2026}
          - {fund_group: capital, fiscal_year: 2027}
          - {fund_group: debt-service, fiscal_year: 2026}
          - {fund_group: debt-service, fiscal_year: 2027}
          - {fund_group: special-revenue, fiscal_year: 2026}
          - {fund_group: special-revenue, fiscal_year: 2027}
          - {fund_group: internal-service, fiscal_year: 2026}
          - {fund_group: internal-service, fiscal_year: 2027}
    rows:
      - {label: "Property Taxes", category: taxes/property}
      - {label: "Other Taxes", category: taxes/other}
      - {label: "Intergovernmental", category: intergovernmental}
      - {label: "Charges for Services", category: charges-for-services}
      - {label: "Use of Money And Property", category: use-of-money-and-property}
      - {label: "Contributions Outsourced", category: contributions-outsourced}
      - {label: "Miscellaneous Revenue", category: miscellaneous-revenue}
      - {label: "Sales Taxes", category: taxes/sales}
      - {label: "Fines & Forfeitures", category: fines-and-forfeitures}
      - {label: "Licenses & Permits", category: licenses-and-permits}

  # --------------------------------------------------------------------------
  - id: spine-expenditures
    kind: expenditure
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    total_row: "TOTAL EXPENDITURES:"
    note: >-
      Object categories, not departments: outside the General Fund the city
      publishes the department and category breakdowns as two marginals with
      no joint. The four rows tie to "TOTAL EXPENDITURES:" in all twelve
      columns. This is the cost of services only; transfers out and additions
      to reserves are separate rules, and adding all three double counts.
    parts:
      - page: 66
        section: "EXPENDITURES:"
        # The second "EXPENDITURES:" is inside "TOTAL EXPENDITURES:".
        section_ordinal: 1
        stop_at: "TOTAL EXPENDITURES:"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
      - page: 67
        labels_from: 66
        # p67 prints the fund-group names again over its expenditure half; the
        # anchor is the last name plus the newline because the spacing between
        # names differs between the two halves.
        section: "Internal Service Funds\n"
        section_ordinal: 2
        stop_at: "$"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27",
                         "FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: capital, fiscal_year: 2026}
          - {fund_group: capital, fiscal_year: 2027}
          - {fund_group: debt-service, fiscal_year: 2026}
          - {fund_group: debt-service, fiscal_year: 2027}
          - {fund_group: special-revenue, fiscal_year: 2026}
          - {fund_group: special-revenue, fiscal_year: 2027}
          - {fund_group: internal-service, fiscal_year: 2026}
          # THE CORPUS'S ONE CONTESTED FIGURE, published as printed. p0067 gives
          # Services & Supplies 16,796,010 and TOTAL EXPENDITURES 26,544,515;
          # p0183, p0075, p0205 and p0209 print that total as 26,294,515. The S&S
          # figure that would yield it is printed on no page.
          # docs/sankey-contract.md, "The contested total". fisc-av0w.
          - {fund_group: internal-service, fiscal_year: 2027}
    rows:
      - {label: "Wages & Benefits", category: wages-and-benefits}
      - {label: "Services & Supplies", category: services-and-supplies}
      - {label: "Capital Outlay", category: capital-outlay}
      - {label: "Debt Services", category: debt-services}

  # --------------------------------------------------------------------------
  - id: spine-transfers-in
    kind: transfer_in
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    note: >-
      One row, "TRANSFER IN:", padded over the 13-row sources run; the other
      rows belong to spine-revenues or, for "TOTAL SOURCES", to no rule. FY2026
      in is $21,525,997 against $59,612,734 out; the $38,086,737 difference is
      the "Transfers Out to CIP" column of pp.72-75 (p0073.txt:58, fisc-4ac),
      outside p76's itemisation (fisc-5gk.3).
    parts:
      - page: 66
        section: "REVENUES:"
        section_ordinal: 1
        # The sources run ends at the "EXPENDITURES:" header.
        stop_at: "EXPENDITURES:"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
      - page: 67
        labels_from: 66
        # Runs past the "$" totals row to the expenditure half's header.
        section: "FY 2026-27"
        section_ordinal: 4
        stop_at: "Capital Funds"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27",
                         "FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: capital, fiscal_year: 2026}
          - {fund_group: capital, fiscal_year: 2027}
          - {fund_group: debt-service, fiscal_year: 2026}
          - {fund_group: debt-service, fiscal_year: 2027}
          - {fund_group: special-revenue, fiscal_year: 2026}
          - {fund_group: special-revenue, fiscal_year: 2027}
          - {fund_group: internal-service, fiscal_year: 2026}
          - {fund_group: internal-service, fiscal_year: 2027}
    rows:
      - {label: "Property Taxes", skip: true}
      - {label: "Other Taxes", skip: true}
      - {label: "Intergovernmental", skip: true}
      - {label: "Charges for Services", skip: true}
      - {label: "Use of Money And Property", skip: true}
      - {label: "Contributions Outsourced", skip: true}
      - {label: "Miscellaneous Revenue", skip: true}
      - {label: "Sales Taxes", skip: true}
      - {label: "Fines & Forfeitures", skip: true}
      - {label: "Licenses & Permits", skip: true}
      - {label: "TOTAL REVENUES:", skip: true}
      - {label: "TRANSFER IN:", category: transfers/in}
      # Printed without a colon, unlike "TOTAL USES:" on the same page.
      - {label: "TOTAL SOURCES", skip: true}

  # --------------------------------------------------------------------------
  - id: spine-transfers-out
    kind: transfer_out
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    note: >-
      One row, "TRANSFER OUT:", padded over the 11-row uses run; the other rows
      belong to spine-expenditures or spine-fund-balance. Counting it as
      spending on top of the expenditure rows counts the same dollar twice.
    parts:
      - page: 66
        section: "EXPENDITURES:"
        section_ordinal: 1
        # The uses run ends at the running footer, whose page number would
        # parse as a figure.
        stop_at: "BUDGET FY 2025-27"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
      - page: 67
        labels_from: 66
        section: "Internal Service Funds\n"
        section_ordinal: 2
        stop_at: "BUDGET FY 2025-27"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27",
                         "FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: capital, fiscal_year: 2026}
          - {fund_group: capital, fiscal_year: 2027}
          - {fund_group: debt-service, fiscal_year: 2026}
          - {fund_group: debt-service, fiscal_year: 2027}
          - {fund_group: special-revenue, fiscal_year: 2026}
          - {fund_group: special-revenue, fiscal_year: 2027}
          - {fund_group: internal-service, fiscal_year: 2026}
          - {fund_group: internal-service, fiscal_year: 2027}
    rows:
      - {label: "Wages & Benefits", skip: true}
      - {label: "Services & Supplies", skip: true}
      - {label: "Capital Outlay", skip: true}
      - {label: "Debt Services", skip: true}
      - {label: "TOTAL EXPENDITURES:", skip: true}
      - {label: "TRANSFER OUT:", category: transfers/out}
      - {label: "ADDITION TO RESERVES", skip: true}
      - {label: "TOTAL USES:", skip: true}
      - {label: "BEGINNING WORKING CAPITAL", skip: true}
      - {label: "CHANGE IN WORKING CAPITAL", skip: true}
      - {label: "ENDING WORKING CAPITAL", skip: true}

