    kind: expenditure
    basis: adopted
    scope: expenditure-by-department
    grain: fund-by-department-by-category
    units: dollars
    total_row: "Total"
    parts:
      - page: 167
        section: "City Council"
        stop_at: "Total"
        column_headers: ["FY 2023-24", "FY 2024-25", "FY 2025-26", "FY 2026-27"]
        columns:
