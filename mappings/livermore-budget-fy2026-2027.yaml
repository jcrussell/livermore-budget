          - {category: debt-services/interest, fund_group: enterprise, fund: 640}
          - {skip: true}
          - {skip: true}
    rows:
      - {label: "2026", fiscal_year: 2026}
      - {label: "2027", fiscal_year: 2027}
      - {label: "2028", fiscal_year: 2028}
      - {label: "2029", fiscal_year: 2029}
