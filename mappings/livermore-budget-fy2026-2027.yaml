  # ==========================================================================
  # DEBT SERVICE BUDGET, pp.80-81: principal and interest by debt issue.
  #
  # p80 prints the issues labelled with FY2024-25's columns; p81 continues the
  # rows positionally for FY2025-26 and FY2026-27. Principal and interest are
  # two rules over one block; the Total column publishes nothing.
  #
  # p80's FY2024-25 column is the REVISED year: each issue's Total equals one
  # fund's revised Debt Services row on pp.172-183 to the dollar. The rows carry
  # no fund: the governmental issues name none.
  #
  # "2020B Certificates of Participation" prints once per payer, so the Airport
  # and Water rows take their heading lines into their labels. "Actitivies" is
  # the page's spelling. The Banc of America dash line is skipped; the loan's
  # figures print on its "Lease/Purchase Loan" line.
  #
  # The activity totals are subtotals held to their issues. p80 stops at
  # "Total  " (the grand Total's label plus its spaces; subtotals have one); on
  # p81 only "$" marks it, the 19th.
  # --------------------------------------------------------------------------
  - id: debt-service-principal
    kind: expenditure
    basis: adopted
    scope: debt-service-by-issue
    grain: category
    units: dollars
    total_row: "Total"
    parts:
      - page: 80
        section: "Governmental Activities:"
        stop_at: "Total  "
        column_headers: ["Principal", "Interest", "Total"]
        columns:
          - {fiscal_year: 2025, basis: revised}
          - {skip: true}
          - {skip: true}
      - page: 81
        labels_from: 80
        section: "Total\n"
        section_ordinal: 1
        stop_at: "$"
        stop_at_ordinal: 19
        column_headers: ["Principal", "Interest", "Total", "Principal", "Interest", "Total"]
        columns:
          - {fiscal_year: 2026}
          - {skip: true}
          - {skip: true}
          - {fiscal_year: 2027}
          - {skip: true}
          - {skip: true}
    rows:
      - {label: "2020A Certificates of Participation", category: debt-services/principal}
      - {label: "2020B Certificates of Participation", category: debt-services/principal}
      - {label: "2022 Certificates of Participation", category: debt-services/principal}
      - {label: "Housing and Urban Development Loans", category: debt-services/principal}
      - {label: "Interfund Loan", category: debt-services/principal}
      - {label: "Internal Service Fund\nBanc of America Equipment", skip: true}
      - {label: "Lease/Purchase Loan", category: debt-services/principal}
      - {label: "Total Governmental Activities", skip: true, subtotal: 1}
      - {label: "Business-Type Actitivies:\nAirport\n2020B Certificates of Participation", category: debt-services/principal}
      - {label: "Banc of America Equipment Lease/Purchase Loan", category: debt-services/principal}
      - {label: "Water\n2020B Certificates of Participation", category: debt-services/principal}
      - {label: "Total Business-Type Activities", skip: true, subtotal: 1}

  # --------------------------------------------------------------------------
  - id: debt-service-interest
    kind: expenditure
    basis: adopted
    scope: debt-service-by-issue
    grain: category
    units: dollars
    total_row: "Total"
    parts:
      - page: 80
        section: "Governmental Activities:"
        stop_at: "Total  "
        column_headers: ["Principal", "Interest", "Total"]
        columns:
          - {skip: true}
          - {fiscal_year: 2025, basis: revised}
          - {skip: true}
      - page: 81
