  # ==========================================================================
  # AVAILABLE FUNDS, USES OF FUNDS, AND FUND BALANCES, pp.186-209.
  #
  # Every fund's sources, uses and balance, for FY2023-24 actuals (pp.186-191),
  # FY2024-25 revised (pp.192-197) and the two adopted years (pp.198-203,
  # pp.204-209). The schedule is transposed against the rest of the book: a
  # row is a FUND and a column is a budget LINE, so each column carries the
  # category and kind and each row the fund.
  #
  # TWELVE PAGE PAIRS, ONE RULE EACH, AND THE CIP BLOCK ONE MORE. An even
  # page prints the fund name, its beginning balance, Revenues, Transfers In
  # and Total Sources; the odd page after it continues the same lines with
  # Expenses, Transfers Out, Transfers Out to CIP, Reserve Increase/(Use),
  # Total Uses and the ending balance, and no labels, so it is read
  # positionally against its even page, as p67 is against p66. The last pair
  # of each year prints the Capital Improvement Program Funds below the
  # internal service funds, and reads them as a rule of their own: those are
  # p222's funds, which fundBalancesRules keeps out of the cuts held to
  # pp.66-67's totals, and a cut selects rules, not rows. The funds above the block are the
  # pair's `-above-cip` rule.
  #
  # ROWS ARE WRITTEN ONCE. The four years print the same 129 rows in one
  # order, labelled identically but for one summary row ("Internal Service
  # Funds" in FY2023-24, "Internal Service" after), and break them across
  # pages differently. Each row is anchored in the first rule that prints it
  # and every later rule aliases it, so a fund's number and group are typed
  # once. The printed totals carry per-year subtotal_deltas and are written
  # per year.
  #
  # PUBLISHED: every fund row but CIP Multi Funded Governmental, which names
  # no fund the appendix numbers, and the summary block's General Fund, which
  # has no detail block of its own. Read and not published: the summary block's
  # other group rows, which are the detail blocks' printed totals again
  # (mapping.TestPublishedFundBalancesSummaryRowsAreTheirBlockTotals holds
  # that); every printed total (fisc-0ijw); and the Total Sources and Total
  # Uses columns, each a row's sum.
  #
  # The two flow columns Revenues and Expenses are a fund's total, not a
  # category of either, so they carry the placeholder categories `revenues`
  # and `expenses`.
  #
  # SUBTOTALS. A fund block's "Total X Funds" is level 1 over the funds since
  # the previous total. In the summary block, Total Operating Budget is level
  # 1 over its six group rows, Total Capital Improvement Program & Internal
  # Service level 1 over its two, and Total City Budget level 2 over all
  # eight. Every column is held, the unpublished two included. Each year is
  # one subtotal_chain because Special Revenue straddles its first page break
  # and, in three years, Enterprise or Internal Service its second.
  #
  # ROUNDING. FY2023-24 actuals are printed rounded to the dollar figure by
  # figure, so four block totals and both summary totals miss their rows by
  # one to three dollars, each declared below; 18 fund lines miss their own
  # identity by a dollar, held in structure.BalanceExceptions. The later
  # years print no rounding of their own: Special Revenue's and Capital's
  # dollar, and the summary totals', carry forward from FY2023-24's endings
  # into each later beginning, Total Sources and ending.
  # --------------------------------------------------------------------------
