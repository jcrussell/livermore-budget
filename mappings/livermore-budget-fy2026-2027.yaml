  # --------------------------------------------------------------------------
  # DEBT SERVICE REQUIREMENTS, pp.80-81: principal and interest owed, by year
  # ending June 30 and by fund type. PROJECTED, NOT ADOPTED: no year is an
  # appropriation.
  #
  # Rows are years: "2026" is fiscal_year 2026. From 2031 a row is a BAND,
  # fiscal_year its first year and fiscal_year_through its last; the last band
  # prints 2051-2055 where ACFR p86 prints 2051-2052.
  #
  # Columns are fund types: Governmental Funds (no single type, so no fund),
  # Internal Service, then on p81 Airport (600), Water (640) and a skipped
  # Grand Total (TestDebtServiceRequirementsCrossFootToTheGrandTotal).
  #
  # Blanks are absent, declared as omitted cells by header ordinal. p81's Total
  # is its seventh "$".
  - id: debt-service-requirements
    kind: expenditure
    basis: projected
    scope: debt-service-requirements
    grain: fund-by-category
    units: dollars
    total_row: "Total"
    parts:
      - page: 80
        # p80 prints the issues' grid above this one; see Part.Grid.
        grid: requirements
        section: "Ending June 30"
        stop_at: "Total"
        omitted_cells:
          - {label: "2030", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2031-2035", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2036-2040", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2041-2045", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2046-2050", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2051-2055", column: "Principal", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2030", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2031-2035", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2036-2040", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2041-2045", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2046-2050", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
          - {label: "2051-2055", column: "Interest", column_ordinal: 2, note: "Internal Service Funds print nothing from 2030; the lease ends in 2029"}
        column_headers: ["Principal", "Interest", "Principal", "Interest"]
        columns:
          - {category: debt-services/principal}
          - {category: debt-services/interest}
          - {category: debt-services/principal, fund_group: internal-service}
          - {category: debt-services/interest, fund_group: internal-service}
      - page: 81
        grid: requirements
        labels_from: 80
        section: "Interest\n"
        stop_at: "$"
        stop_at_ordinal: 7
        omitted_cells:
          - {label: "2046-2050", column: "Principal", column_ordinal: 1, note: "Airport Fund prints nothing from 2046"}
          - {label: "2051-2055", column: "Principal", column_ordinal: 1, note: "Airport Fund prints nothing from 2046"}
          - {label: "2046-2050", column: "Interest", column_ordinal: 1, note: "Airport Fund prints nothing from 2046"}
          - {label: "2051-2055", column: "Interest", column_ordinal: 1, note: "Airport Fund prints nothing from 2046"}
          - {label: "2036-2040", column: "Principal", column_ordinal: 2, note: "Water Fund prints nothing from 2036"}
          - {label: "2041-2045", column: "Principal", column_ordinal: 2, note: "Water Fund prints nothing from 2036"}
          - {label: "2046-2050", column: "Principal", column_ordinal: 2, note: "Water Fund prints nothing from 2036"}
          - {label: "2051-2055", column: "Principal", column_ordinal: 2, note: "Water Fund prints nothing from 2036"}
