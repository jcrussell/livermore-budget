          - {fund_group: capital, fiscal_year: 2027}
          - {fund_group: debt-service, fiscal_year: 2026}
          - {fund_group: debt-service, fiscal_year: 2027}
          - {fund_group: special-revenue, fiscal_year: 2026}
          - {fund_group: special-revenue, fiscal_year: 2027}
          - {fund_group: internal-service, fiscal_year: 2026}
          - {fund_group: internal-service, fiscal_year: 2027}
    rows:
      - {label: "Wages & Benefits", skip: true}
      - {label: "Services & Supplies", skip: true}
      - {label: "Capital Outlay", skip: true}
      - {label: "Debt Services", skip: true}
      - {label: "TOTAL EXPENDITURES:", skip: true}
      - {label: "TRANSFER OUT:", skip: true}
      - {label: "ADDITION TO RESERVES", category: fund-balance/reserve-increase}
      - {label: "TOTAL USES:", skip: true}
      - {label: "BEGINNING WORKING CAPITAL", category: fund-balance/beginning}
      - {label: "CHANGE IN WORKING CAPITAL", category: fund-balance/change}
      - {label: "ENDING WORKING CAPITAL", category: fund-balance/ending}

  # ==========================================================================
  # GENERAL FUND EXPENDITURES BY MAJOR CATEGORY, PDF pp. 167-170
  #
  # A finer decomposition of money the spine already publishes: per object
  # category these rows sum exactly to p66's General Fund cells, so they carry
  # their own scope (fisc-brx, fisc-u2v); cuts-tie-along-the-lattice ties them
  # to the spine through the general-fund-departments cut.
  #
  # One rule per division (fisc-28s A-prime), each tying to its printed
  # `Total`; `rollups:` cover the `<DEPARTMENT> TOTAL` lines and p170's
  # `General Fund Total Expenses`. No ordinals: department headings are ALL CAPS
  # and the case-sensitive division anchors each occur once per page.
  #
  # Every part states a stop_at: StatedTotals searches the text after the block.
  # Wrapped division labels declare only the tail (fisc-0cs); p167's bare
  # `TOTAL` belongs to a rollup's line, outside every block, and is not declared.
  # Three divisions straddle a page break and use `total_spans_parts` (fisc-w0o).
  #
  # Four declared one-dollar deltas, all in the FY2023-24 Actual column, each
  # re-derived from the page; the department rollups sum printed TOTALS, so no
  # rounding is absorbed twice.
  # ==========================================================================

