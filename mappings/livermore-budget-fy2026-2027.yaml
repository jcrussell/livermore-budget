    kind: fund_balance
    basis: adopted
    scope: all-funds-gross
    grain: fund-group-by-category
    units: dollars
    note: >-
      The four fund-balance rows of the uses run. "ADDITION TO RESERVES" is a
      use in the year; "CHANGE IN WORKING CAPITAL" is a signed flow; BEGINNING
      and ENDING WORKING CAPITAL are stocks, never summed with a flow, and the
      Sankey excludes them by category.
    parts:
      - page: 66
        section: "EXPENDITURES:"
        section_ordinal: 1
        stop_at: "BUDGET FY 2025-27"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27"]
        columns:
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          - {fund_group: enterprise, fiscal_year: 2026}
          - {fund_group: enterprise, fiscal_year: 2027}
      - page: 67
        labels_from: 66
        section: "Internal Service Funds\n"
        section_ordinal: 2
        stop_at: "BUDGET FY 2025-27"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2025-26", "FY 2026-27",
