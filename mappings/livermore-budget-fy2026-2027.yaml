  # ==========================================================================
  # CAPITAL IMPROVEMENT PROGRAM, PROJECT LISTING BY FUND, pp.224-235.
  #
  # Every CIP project by paying fund, FY2024-25 through FY2030-45. Read here and
  # not in the CIP document, whose OCR layer drops dashes and splits digits
  # (fisc-8ln). Six page pairs, one rule each: the odd page continues the even
  # page's lines positionally. The label is the fund number, the tail the
  # project number and name.
  #
  # FY2025-26 and FY2026-27 publish as adopted, FY2027-28 to FY2029-30 as
  # projected. Read and not published: FY2024-25 (basis unstated; its total is
  # not p222's revised figure), FY2030-45 (fifteen years in one figure) and
  # TOTAL. The budget years carry forward unspent appropriations
  # (structure.BudgetBookResidue).
  #
  # Totals are subtotal rows (1 fund 101 sub-block, 2 fund, 3 grand total), held
  # in every column; the six rules are one subtotal_chain because funds 290, 552
  # and 560 are totalled on the next pair. Fund 611 is skipped: p230 lists its
  # projects twice on lines identical but for their figures. The stray "." on
  # p224 is declared.
  # --------------------------------------------------------------------------
  - id: cip-listing-p0224
    kind: expenditure
    basis: adopted
    scope: cip-project-listing
    grain: fund-by-category
    units: dollars
    subtotal_chain: cip-project-listing-by-fund
    row_labels_are_fund_numbers: true
    parts:
      - page: 224
        section: "FY 2024-25\n"
        stop_at: "BUDGET FY 2025-27"
        wrapped_labels: ["."]
        column_headers: ["FY 2024-25"]
        columns:
          - {skip: true}
      - page: 225
        labels_from: 224
        section: "TOTAL\n"
        stop_at: "BUDGET FY 2025-27"
        column_headers: ["FY 2025-26", "FY 2026-27", "FY 2027-28", "FY 2028-29", "FY 2029-30",
                         "FY 2030-45", "TOTAL"]
        columns:
          - {fiscal_year: 2026}
          - {fiscal_year: 2027}
          - {fiscal_year: 2028, basis: projected}
          - {fiscal_year: 2029, basis: projected}
          - {fiscal_year: 2030, basis: projected}
          - {skip: true}
          - {skip: true}
    rows:
      - {label: "101", label_tail: "BL201518 Carpet Replacement for City Buildings", category: capital-projects, fund: 101, fund_group: capital}
      - {label: "101", label_tail: "BL201830 City Hall HVAC & Central Plant Chiller Replacement", category: capital-projects, fund: 101, fund_group: capital}
      - {label: "101", label_tail: "BL202125 UPS Replacements at Civic Center", category: capital-projects, fund: 101, fund_group: capital}
