  # --------------------------------------------------------------------------
  - id: p76-transfers-in-permanent
    kind: transfer_in
    basis: adopted
    scope: transfers-by-fund
    units: dollars
    note: >-
      One transfer into a Permanent fund, and both budget figures are "-" --
      published zeros, not absent. pp.66-67 print NO Permanent column at all
      (fisc-u8o), so this is the one key transfers-detail-ties-to-spine has
      with no spine counterpart. It is published because the page publishes it:
      "absent is not zero" cuts both ways, and a zero the city printed is a
      figure. The payer, "Open Space", is 300 and not Doolan Canyon Open Space
      (471), which is the receiving side's near-twin.
    parts:
