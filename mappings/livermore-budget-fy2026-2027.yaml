  # ==========================================================================
  # BUDGET BOOK p76, "SUMMARY OF TRANSFERS" -- scope: transfers-by-fund.
  #
  # The same money as the spine: each receiving group's section total equals
  # pp.66-67's TRANSFER IN cell exactly, so this page has its own scope
  # (fisc-aes, fisc-u2v).
  #
  # ONE PRINTED FIGURE, TWO FACTS: each row's fund is the DESTINATION and its
  # counterpart the PAYER, both citing the one figure (fisc-4rh). A column is a
  # year and the section the receiving group, so fund_group is on the column
  # and fund on the row.
  #
  # Only the two budget columns publish: FY2023-24 and FY2024-25 miss the
  # page's grand total by 6,858,051 and 5,000,000, and the spine prints no
  # column to reconcile them.
  #
  # NO total_row: the one grand total (p0076.txt:64) has no label and a rollup
  # is refused, so TestPublishedP76SumsToItsPrintedGrandTotal holds the five
  # rules to it and cuts-tie-along-the-lattice ties them to the spine
  # (fisc-9m7).
  # ==========================================================================
  - id: p76-transfers-in-general
    kind: transfer_in
    basis: adopted
    scope: transfers-by-fund
    grain: fund-by-category
    units: dollars
    note: >-
