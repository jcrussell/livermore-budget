  # ==========================================================================
  # DEPARTMENTWIDE EXPENDITURES BY CATEGORY, pp.85-125 -- scope
  # departmentwide-expenditures.
  #
  # The UPPER block of the same fourteen pages whose lower block is mapped above
  # as department-funding-sources. Fourteen pages print the header; the
  # "Expenditures by Category" block is on ELEVEN of them, one per department
  # (p102, p120 and p125 are continuation pages carrying funding sources only).
  # 29 division blocks, 73 object rows.
  #
  # WHY ITS OWN SCOPE. These rows OVERLAP pp.167-170's, which publish the
  # General Fund slice of 23 of these same 29 divisions at scope
  # expenditure-by-department. Netting the two together would double every
  # General Fund division. Same hazard and same answer as fisc-u2v.
  #
  # THE COLUMNS CARRY NO FUND, and that is the page rather than an omission:
  # this block prints a department's spending whatever pays for it, and the
  # fund breakdown is the OTHER block on the same page. So these facts tie to a
  # citywide grand total and cannot tie to the spine's six per-group cells.
  #
  # WHAT THEY RECONCILE TO, measured. The eleven printed Total Department
  # Expenditures rows against p0183:66 "Grand Total":
  #
  #     FY2023-24   207,274,363  vs  207,007,564   diff 266,799
  #     FY2024-25   253,257,192  vs  253,257,192   tie
  #     FY2025-26   254,095,412  vs  254,095,412   tie
  #     FY2026-27   252,604,896  vs  252,604,896   tie
  #
  # The one difference decomposes entirely: 266,798 is dw-maintenance's
  # Transfers Out row, which p183 correctly excludes from an EXPENDITURE total,
  # and the remaining 1 is the FY2023-24 rounding this file declares on eleven
  # other blocks.
  #
  # AND AGAINST THE SPINE: FY2025-26 ties at 254,095,412 exactly, while
  # FY2026-27 is 252,604,896 against the spine's 252,854,896 -- exactly p0067's
  # contested internal-service figure (fisc-av0w), from a decomposition that
  # shares no row with any of that bead's other five witnesses.
  #
  # FOUR ANCHORS NEED section_ordinal, because each also matches something in the
  # funding-sources block below it on the same page. Three of the four are the
  # division's own name appearing again as a FUND -- Information Technology,
  # Airport, Horizons. The fourth is not: p115:29 prints "Library Donations", and
  # an anchor matches by substring, so "Library" finds it.
  # ==========================================================================

