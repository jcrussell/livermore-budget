      Fund TRANSFER IN cell. The anchor's newline separates the heading from
      the row labels that end in "General Fund".
    parts:
      - page: 76
        section: "General Fund\n"
        section_ordinal: 1
        stop_at: "Enterprise Funds"
        # The trailing null is the unheaded footnote-marker column (fisc-wfi).
        column_headers: ["FY 2023-24", "FY 2024-25", "FY 2025-26", "FY 2026-27", ~]
        columns:
          - {skip: true}
          - {skip: true}
          - {fund_group: general, fiscal_year: 2026}
          - {fund_group: general, fiscal_year: 2027}
          # The footnote marker: skipped, since amount.Parse reads "(10)" as
          # negative ten dollars.
          - {skip: true}
    rows:
