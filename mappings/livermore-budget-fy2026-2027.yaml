rollups:
  # --------------------------------------------------------------------------
  - id: dept-city-council
    page: 167
    total_row: "CITY COUNCIL TOTAL"
    covers: [div-city-council]

  # --------------------------------------------------------------------------
  - id: dept-city-manager
    page: 167
    total_row: "CITY MANAGER TOTAL"
    covers: [div-city-manager, div-city-clerk]

  # --------------------------------------------------------------------------
  - id: dept-city-attorney
    page: 167
    total_row: "CITY ATTORNEY TOTAL"
    covers: [div-city-attorney]

  # --------------------------------------------------------------------------
  - id: dept-library
    page: 167
    total_row: "LIBRARY DEPARTMENT TOTAL"
    covers: [div-library]

  # --------------------------------------------------------------------------
  - id: dept-innovation-and-economic-development
    page: 167
    total_row: "INNOVATION & ECONOMIC DEVELOPEMENT"
    note: >-
      TWO ANOMALIES IN ONE LINE, both the city's. The anchor carries the page's
      own misspelling -- DEVELOPEMENT, where the heading on line 53 spells it
      correctly -- and the word TOTAL wraps onto the next line, so the anchor
      must be the department name, which is what the figures share a line with.
    covers: [div-innovation-and-economic-devel]

  # --------------------------------------------------------------------------
  - id: dept-general-services
    page: 168
    total_row: "GENERAL SERVICES TOTAL"
    covers: [div-general-services]

  # --------------------------------------------------------------------------
  - id: dept-administrative-services
    page: 168
    total_row: "ADMINISTRATIVE SERVICES TOTAL"
    note: >-
      The measurement the rollup design rests on: this total is $6,311,564 and so
      is the sum of the three printed division Totals, while the six object rows
      beneath them give $6,311,563. Finance's declared dollar is absorbed by its
      own printed Total and reappears here. A rollup summing leaves would fail.
    covers: [div-administrative-services, div-finance, div-human-resources]

  # --------------------------------------------------------------------------
  - id: dept-police
    page: 169
    total_row: "POLICE DEPARTMENT TOTAL"
    covers:
      - div-police-administration
      - div-patrol
      - div-support-services
      - div-special-operations

  # --------------------------------------------------------------------------
  - id: dept-community-development
    page: 169
    total_row: "COMMUNITY DEVELOPMENT TOTAL"
    note: >-
      Planning's declared -$1 is absorbed by its own printed Total, so this total
      ties exactly against the five printed Totals -- the same two-level chain
      ADMINISTRATIVE SERVICES shows with the opposite sign.
    covers:
      - div-community-development-admin
      - div-building-and-safety
      - div-engineering
      - div-housing-and-human-services
      - div-planning

  # --------------------------------------------------------------------------
  - id: dept-public-works
    page: 170
    total_row: "PUBLIC WORKS DEPARTMENT TOTAL"
    note: >-
      The one department whose total row is not its heading plus " TOTAL": the
      heading on p169 line 47 is PUBLIC WORKS. Its two declared dollars have
      opposite signs and cancel, which is why this total ties against the object
      rows too -- an accident of the document, not something to rely on.
    covers: [div-public-works-administration, div-maintenance, div-environmental-services]

  # --------------------------------------------------------------------------
  - id: dept-fire
    page: 170
    total_row: "FIRE DEPARTMENT TOTAL"
    covers: [div-fire-administration]

  # --------------------------------------------------------------------------
  - id: gf-total-expenses
    page: 170
    total_row: "General Fund Total Expenses"
    note: >-
      The schedule's own closing total, over all 23 divisions. It is what ties the
      department axis to the citywide spine: $144,650,802 in FY2025-26 and
      $149,014,579 in FY2026-27 are p66's TOTAL EXPENDITURES for the General
      Fund, to the cent.
    covers:
      - div-city-council
      - div-city-manager
      - div-city-clerk
      - div-city-attorney
      - div-library
      - div-innovation-and-economic-devel
