  # ==========================================================================
  # GENERAL FUND EXPENDITURES BY MAJOR CATEGORY, PDF pp. 167-170
  #
  # A SECOND, FINER DECOMPOSITION OF MONEY THE SPINE ABOVE ALREADY PUBLISHES,
  # and that is the whole reason these rules carry their own scope. The 49
  # object rows below sum, per object category, to exactly what p66 prints for
  # the General Fund -- Wages & Benefits 81,801,011 / 83,825,633, Services &
  # Supplies 62,849,791 / 65,188,946, Capital Outlay and Debt Services zero in
  # both budget years, total 144,650,802 / 149,014,579. Mapped at
  # `all-funds-gross` they would be summed ON TOP of the spine's cells and the
  # published General Fund expenditure would double with every check green.
  # That is fisc-brx's decision and fisc-u2v's mechanism;
  # cuts-tie-along-the-lattice is what ties the two together, through the
  # general-fund-departments cut.
  #
  # WHAT THE PAGES LOOK LIKE. Eleven ALL-CAPS DEPARTMENT headings, each opening
  # a run of mixed-case DIVISIONS. A division prints two or three object rows
  # and then its own `Total`; a department closes with `<DEPARTMENT> TOTAL`;
  # p170 closes the schedule with `General Fund Total Expenses`. One rule per
  # division (fisc-28s A-prime), because the division is the level whose rows
  # and printed total sit together, and twelve `rollups:` below for the totals
  # that cover more than one line of rules.
  #
  # ANCHORS NEED NO ORDINALS HERE, and that is worth saying because every rule
  # in the spine above needs one. The department headings are ALL CAPS and the
  # division labels are Title Case, an anchor is a case-sensitive substring
  # search, and each of the 23 division labels occurs exactly once on its page
  # -- `General Services` on p167 does not match `GENERAL SERVICES` two lines
  # above it, and `Administrative Services` on p168 does not match
  # `ADMINISTRATIVE SERVICES`. Adding ordinals defensively would pin a
  # coincidence rather than a claim.
  #
  # EVERY PART STATES A stop_at, for two reasons and not the one that is easy
  # to assume. A part whose rule prints a total NEEDS one, because StatedTotals
  # searches the text after the block and a block running to the end of the
  # page leaves nothing to search. And a part with no stop_at takes the running
  # footer with it, which the unmapped-trailing-text guard then reports -- the
  # footer's bare page number never reaches amount.Parse, because the token
  # list is truncated to the column count first.
  #
  # FOUR DIVISION LABELS WRAP, and a wrapped tail lands between one row's
  # figures and the next row's label (fisc-0cs). Only the TAIL is declared --
  # `Devel`, `Development Admin`, `Services`, `Administration` -- because the
  # head is what the section anchor consumed. p167 line 62's bare `TOTAL` is a
  # fifth wrapped fragment on these pages and is deliberately NOT declared: it
  # belongs to the INNOVATION rollup's own line and falls outside every rule's
  # block, so declaring it would be a declaration the page never uses.
  #
  # THREE DIVISIONS STRADDLE A PAGE BREAK -- General Services, Special
  # Operations, Environmental Services -- so their rows are in two parts and
  # their printed Total in one. `total_spans_parts` is what lets CheckTotals
  # sum both parts against it (fisc-w0o). THREE DEPARTMENTS straddle one too,
  # which costs nothing: a rollup names the page that PRINTS its total.
  #
  # FOUR DECLARED DELTAS, all in the FY2023-24 Actual column, all one dollar,
  # two positive and two negative, each re-derived by summing that division's
  # object rows off the page. They are the document's own arithmetic, and the
  # two-level chain is what keeps them honest: each division's rows tie to its
  # printed Total by way of its declared dollar, and the department rollups sum
  # the printed TOTALS rather than the rows, so no rounding is absorbed twice.
  # ADMINISTRATIVE SERVICES is the worked example -- $6,311,564 against object
  # rows of $6,311,563.
  # ==========================================================================

