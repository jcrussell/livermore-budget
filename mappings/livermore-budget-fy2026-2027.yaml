  # ==========================================================================
  # DEPARTMENT FUNDING SOURCES, pp. 85-125 (fisc-71j)
  #
  # Fourteen pages print "DEPARTMENTWIDE EXPENDITURES WITH FUNDING SOURCES" for
  # eleven departments; three of those departments run onto a second page. The
  # block at the foot of each answers a question no other schedule in this book
  # answers directly: WHICH FUNDS PAY FOR THIS DEPARTMENT. 78 rows, four columns
  # each.
  #
  # THE ROW IS A FUND AND THE COLUMN IS A YEAR, which is p76's inversion and not
  # the usual shape -- so `fund` and `fund_group` sit on the ROW here, and the
  # columns carry no fund dimension at all. Each row's pair is what makes
  # fact-funds-resolve a real check on this schedule: it refuses a fund whose
  # type in data/funds.yaml disagrees with the group the row claims.
  #
  # ITS OWN SCOPE, AND THE MEASUREMENT IS THE REASON. Summed by fund group these
  # 78 rows give, per group, pp.66-67's printed TOTAL EXPENDITURES:
  #
  #        FY2025-26                     FY2026-27
  #        capital            1,061,355     969,934
  #        debt-service       6,984,597   6,969,898
  #        enterprise        57,053,730  57,547,970
  #        general          144,650,802 149,014,579
  #        internal-service  25,077,367  26,294,515  (p0067 prints 26,544,515)
  #        special-revenue   19,267,561  11,808,000
  #        total            254,095,412 252,604,896
  #
  # The total row is THESE PAGES' total and not the spine's. FY2025-26 is also
  # all_funds_gross_expenditure_cents, the headline the site publishes;
  # FY2026-27's headline is 252,854,896, because the spine carries p0067's
  # 26,544,515. Reading the second column as the spine's is the mistake the
  # rest of this comment exists to prevent.
  #
  # Eleven of twelve cells tie TO THE CENT. That is the same money pp.66-67
  # already publish, cut by paying fund instead of by object -- so publishing it
  # at all-funds-gross would double the city's expenditure with every check
  # green, which is fisc-u2v's mechanism (see the bd memory
  # detail-pages-double-the-spine). Hence scope: department-funding-sources,
  # and the funding-sources cut cuts-tie-along-the-lattice compares against
  # the spine.
  #
  # THE TWELFTH CELL IS THE CITY'S ERROR, NOT OURS. pp.172-183 ("Citywide
  # Expenditures") print every fund's object rows and one Total per fund group.
  # DERIVED from those printed lines -- no page prints a group-by-object
  # subtotal, so the grid is ours -- the six groups by four objects over two
  # budget years give 48 cells, and 47 agree with pp.66-67 to the dollar. The
  # one that does not is internal-service Services & Supplies FY2026-27, where
  # p0067 prints 16,796,010 and the five internal service funds' printed rows
  # sum to 250,000 less. 16,546,010 is that sum and is PRINTED ON NO PAGE; do
  # not cite it as one. Five other published schedules --
  # p0183:64, p0075:53, p0205:17, p0209:20, p0061:39 -- all say 26,294,515 and
  # none says 26,544,515. Tracked as fisc-av0w; the funding-sources cut
  # carries one named exception for that cell --
  # p0067-internal-service-is-250000-high-by-fund-group -- and nothing else.
  #
  # A SEVENTH GROUP APPEARS AND IS HARMLESS. Doolan Canyon Preserve Endow (470)
  # is `permanent`, which has no spine column (fisc-u8o). It is 620,581 in
  # FY2023-24 and ZERO in all three later columns, so the budget-year tie above
  # is unaffected -- but the check names it rather than leaving a group silently
  # unmentioned.
  #
  # THE ANCHORS. "Department Funding Sources" occurs twice on every page that
  # prints its own total, because "Total Department Funding Sources" contains
  # it; the trailing newline is what makes the heading unique, the same device
  # the spine uses with "Internal Service Funds\n", and it fails closed if the
  # heading stops ending its line. The three continuation parts print no such
  # heading, so they anchor on the end of the column header line, "FY 2026-27\n"
  # -- which occurs exactly once on all fourteen pages. No section_ordinal is
  # needed anywhere in this block, and that is a checked claim rather than an
  # omission.
  #
  # EVERY PART DECLARES column_headers, and fisc-7q6 must repeat them BYTE FOR
  # BYTE when it maps the Expenditures by Category block above. checkColumnGrids
  # is per (doc_id, page) and all-or-none: a later part on one of these pages
  # that omitted the list would be a hard parse error, not a silently weaker
  # read. One printed header line serves both blocks on each page.
  #
  # WHAT GUARDS THE 78 HAND-TYPED FUND NUMBERS, and it is not the arithmetic.
  # A fund of a different type breaks its group's sum against the spine, and
  # fact-funds-resolve refuses a fund whose type disagrees with the group typed
  # beside it -- but a SAME-TYPE substitution moves no sum and neither sees it.
  #
  # Every rule below therefore declares `row_labels_name_funds: true`, which is
  # the claim that its row labels are the printed names of the funds they carry.
  # row-funds-match-their-anchors reads each label whole against data/funds.yaml
  # and checks the number typed beside it (fisc-90fp). Before that declaration
  # existed the swap was red under `go test` -- TestEveryFundingSourceFactMatches-
  # ThePrintedRow has asserted it since this lane landed -- and GREEN under
  # `fisc verify`, which is the gate a reader of the published site runs.
  # rule-funds-match-their-headings still never enters: it reads column funds
  # and these rules declare none.
  #
  # The numbers below were resolved by matching each printed label against
  # data/funds.yaml's `name` and `aliases[].term` -- 54 by name, 9 by alias, and
  # no label matches two funds. No fund-registry edit was needed for this lane.
  # ==========================================================================

