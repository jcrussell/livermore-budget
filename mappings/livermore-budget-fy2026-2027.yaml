  # ==========================================================================
  # AVAILABLE FUNDS, USES OF FUNDS, AND FUND BALANCES, pp.186-209.
  #
  # Every fund's sources, uses and balance: FY2023-24 actuals (pp.186-191),
  # FY2024-25 revised (pp.192-197), the two adopted years (pp.198-209).
  # Transposed: a row is a FUND and a column a budget LINE carrying category
  # and kind. Twelve page pairs, one rule each, the odd page positional; the
  # last pair of each year also has a rule for the CIP funds, which
  # fundBalancesRules keeps out of the cuts held to pp.66-67.
  #
  # The four years print the same 129 rows; each is anchored in the first rule
  # that prints it and aliased after, so its fund is typed once.
  #
  # Not published: CIP Multi Funded Governmental (no appendix number), the
  # summary block's group rows (the detail totals again,
  # mapping.TestPublishedFundBalancesSummaryRowsAreTheirBlockTotals), every
  # printed total (fisc-0ijw), and Total Sources / Total Uses. Revenues and
  # Expenses carry the placeholder categories `revenues` and `expenses`.
  #
  # Totals are subtotal rows held in every column; each year is one
  # subtotal_chain. FY2023-24 actuals are rounded figure by figure: block and
  # summary totals miss by one to three dollars, declared below, and 18 fund
  # lines miss their identity by a dollar (structure.BalanceExceptions); later
  # years inherit those dollars through their beginning balances.
  # --------------------------------------------------------------------------
