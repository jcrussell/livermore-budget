  # ==================================================================
  # EXPENDITURE — the ACFR's function axis
  #
  # A THIRD EXPENDITURE AXIS, AND THE FIRST THAT IS NOT THE BUDGET
  # BOOK'S. The four objects above answer "what was the money spent
  # on"; department-funding-sources below answers "which fund paid";
  # this answers "which function of government performed it", which is
  # how the ACFR's MD&A cuts the same General Fund money.
  #
  # It exists for ACFR p41's "General Government:" block, whose five
  # rows -- City Council, City Manager, City Attorney, Administrative
  # Services, General Services -- are the divisions the function covers.
  # They share this one category and are told apart by their row_label,
  # which is this file's own doctrine for detail lines: p127 prints
  # thirteen property-tax lines that all classify as taxes/property.
  #
  # SUMMING IT WITH THE FOUR OBJECT CATEGORIES WOULD DOUBLE-COUNT, and
  # what prevents that is the SCOPE, not this note. These facts are
  # published at acfr-general-fund-summary and the spine's are at
  # all-funds-gross, so no projection nets them together. Here the
  # separation is doubly safe and it is worth saying why, because the
  # reason is not the one the funding-source note gives: this document
  # is FY2025 audited and the Budget Book prints no audited column, so
  # the two share no (kind, category, fund_group, fund, fiscal year,
  # basis) key at all.
  #
  # AND THE FACTS CARRY NO `department:`, which is a constraint rather
  # than a choice and a different one from the funding-source case
  # below. Three of the five rows -- city-council, city-attorney,
  # general-services -- are 1:1 with a division of data/departments.yaml
  # and could carry one. Two are not: "Administrative Services" the
  # DEPARTMENT covers the administrative-services, finance and
  # human-resources divisions, and "City Manager" covers city-manager
  # and city-clerk. p41 prints department-level aggregates, so typing
  # the division slug would file a three-division figure under one
  # division -- and fact-departments-resolve would PASS on it, because
  # the strings coincide. Three rows classified correctly and two
  # silently wrong is worse than none, so none carry it. That is this
  # page's grain; the funding-source block below carries one.
  # ==================================================================

