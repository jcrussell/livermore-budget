      and FY 2024-25 (p186, p192), which p66 does not print, carry forward
      from the ending column of the year before.
    source_note: >-
      Budget Book p. 66 (row), p. 74 (column, 7/1/26) and pp. 198/204 (the
      General Fund's opening column). The alias term is
      disambiguated from fund-balance/ending only by the date in the header
      (7/1 opening vs 6/30 closing), which is why both entries carry the same
      alias string.

