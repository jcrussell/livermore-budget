          than a spelling difference. It rests on position -- both sit between
          Intergovernmental and Fines in a revenue list the two documents order
          alike -- and on nothing arithmetic: the ACFR prints a dash here in
          FY2025, so there is no figure to reconcile even in principle.
        note: >-
