      #@cite p0041 (ACFR) "Fund Balances- Beginning, as restated    92.10    83.90"
      - term: "Fund Balances- Beginning, as restated"
        pages: [41]
        derived: true
        rationale: >-
          Same merge as the alias above and on weaker evidence, which is why it
          is flagged separately. "Fund balance" and "working capital" are the
          city's two words for one column — the argument is on this category's
          parent — but the p66/p74 alias is proven arithmetically and this one
          cannot be: the ACFR figure is FY2024-25 audited and pp.66-67 print no
          audited column, so no cell is shared. The binding rests on the words
          and on the row's position as the opening balance of the statement.
        note: >-
          ACFR p41, not a Budget Book page. "AS RESTATED" IS A MATERIAL
          QUALIFIER AND IS NOT PART OF THE BINDING: the ACFR footnotes that
          prior-year amounts were not restated for GASB 101 (compensated
          absences), so this is an opening balance the city has adjusted. The
          category says which line it is; it does not say the figure is
          comparable to an unrestated one.
    derived: true
    rationale: >-
      The merge is ours. p66 labels the row and pp. 68/70/72/74 label a column,
