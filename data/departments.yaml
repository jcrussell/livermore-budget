# Canonical department registry — the ONLY place a `department:` value on a
# mapping row is bound to a printed name and to the department above it.
#
#@cite City of Livermore, "FY 2025-2027 Budget Book" (source id: livermore-budget-fy2026-2027)
#@cite     "General Fund Expenditures by Major Category", PDF pp. 167-170
#@cite     "Departmentwide Expenditures with Funding Sources", PDF pp. 85-125
#
# TWO TIERS, AND THE FACTS NAME THE LOWER ONE. 29 mixed-case DIVISIONS grouped
# under 11 ALL-CAPS DEPARTMENTS. A mapping row's `department:` field carries the
# DIVISION slug, because the division is the level the object rows are printed
# under and the level whose `Total` the document prints beside them. The
# department is reached through the division's `department:` field here, and it
# is what the `<DEPARTMENT> TOTAL` rollups assert.
#
# TWO SCHEDULES PRINT THIS AXIS AND THEY DO NOT AGREE ON ITS SIZE, which is why
# every DIVISION entry's `pages` names both where it applies. The DEPARTMENT
# entries below still name pp.167-170 only, though each department's ALL-CAPS
# heading is printed on its pp.85-125 page too -- fisc-h2ls, and note that
# TestEveryDivisionIsPrintedOnItsPages covers divisions and not departments, so
# nothing catches it. pp.167-170 are a GENERAL
# FUND schedule and print 23 divisions. pp.85-125 are the whole department,
# whatever fund pays for it, and print 29 — the same 23, matched by label
# exactly, plus six that no General Fund schedule can show because their money
# is mostly not the General Fund's:
#
#   Risk Management          p93   under CITY ATTORNEY
#   Information Technology   p97   under ADMINISTRATIVE SERVICES
#   Cybersecurity            p97   under ADMINISTRATIVE SERVICES
#   Airport                  p111  under INNOVATION & ECONOMIC DEVELOPMENT
#   Horizons                 p119  under POLICE DEPARTMENT
#   Water Resources          p124  under PUBLIC WORKS
#
# The 23 match by LABEL and not merely by slug, wrapped ones included: both
# schedules wrap "Community Development Admin", "Housing & Human Services",
# "Innovation & Economic Devel" and "Public Works Administration" across two
# lines. Three of the four break at the same point on both. THE FOURTH DOES NOT
# -- p101 gives "Community Development" / "Admin" where p169 gives "Community" /
# "Development Admin" -- so a rule anchoring on either page's head is anchoring
# on that page and not on the label. Each entry's note records its own breaks.
# No entry needs an alias, and none has one.
#
# TWO NAMESPACES, NOT ONE, AND THAT IS FORCED BY THE PAGE. Five departments
# share a name with a division beneath them, all five matching on slug and on
# label:
#
#   CITY COUNCIL            p167:7   / City Council            p167:9
#   CITY MANAGER            p167:17  / City Manager            p167:19
#   CITY ATTORNEY           p167:33  / City Attorney           p167:35
#   GENERAL SERVICES        p167:63  / General Services        p168:7
#   ADMINISTRATIVE SERVICES p168:15  / Administrative Services p168:17
#
# So slugs are unique WITHIN each tier and deliberately not across them:
# requiring that would mean inventing five names the city does not print, and an
# invented name in a registry whose whole claim is "this is what the document
# says" is the defect this project exists to refuse. `city-council` naming both
# a department and its sole division is the document's own structure.
#
# WHAT DOES NOT RELAX: no slug in EITHER tier may equal a data/taxonomy.yaml
# category slug. A fact's row_path joins the slug its `department` field holds
# to its category on a "/" (internal/fact.RowPath), so a string spanning those
# two AXES is genuinely ambiguous, where a department and a division sharing a
# name is not.
#
# The rule reaches the department tier because that field now holds both:
# pp.167-170 and pp.85-125's upper block name a DIVISION, and pp.85-125's
# funding-source rows name a DEPARTMENT. Three taxonomy slugs carry a
# `-function` suffix rather than their mechanical form for this reason, and
# the suffix is on that side because every slug here is a transform of a
# printed heading and nothing here is derived.
#
# EVERYTHING HERE IS PUBLISHED. The slugs are mechanical transforms of printed
# labels, and the parentage is printed too — each ALL-CAPS heading opens its
# department, its divisions follow, and `<DEPARTMENT> TOTAL` closes it. Nothing
# in this file is derived, which is why no entry carries a rationale.
#
# THREE THINGS THE PAGES DO THAT A READER WOULD NOT EXPECT, recorded rather
# than smoothed over:
#
#   - PUBLIC WORKS (p169:47) closes as "PUBLIC WORKS DEPARTMENT TOTAL"
#     (p170:11). Every other department's total row is its heading plus
#     " TOTAL". A rule that derives the anchor from the heading is wrong here.
#   - INNOVATION & ECONOMIC DEVELOPMENT (p167:53) closes as
#     "INNOVATION & ECONOMIC DEVELOPEMENT TOTAL" (p167:61-62) — the city's own
#     misspelling, and wrapped across two lines. `document_term` is the
#     heading's spelling; the total row's is the rule file's business.
#   - Fire Administration prints ONE object row (Services & Supplies, p170:15).
#     The department is a contract service and has no wages line at all, so
#     nothing may assume a division carries two or three object rows.
#
# Three departments and three divisions straddle a page break; `pages` lists
# every page an entry is printed on, in ascending order.

schema_version: 1

departments:
  - slug: city-council
    label: City Council
    document_term: CITY COUNCIL
    pages: [167]

  - slug: city-manager
    label: City Manager
    document_term: CITY MANAGER
    pages: [167]
    note: >-
      The only department on p167 with more than one division: City Manager and
      City Clerk are printed as separate row groups, each with its own Total,
      under one CITY MANAGER TOTAL.

  - slug: city-attorney
    label: City Attorney
    document_term: CITY ATTORNEY
    pages: [167]

  - slug: library-department
    label: Library Department
    document_term: LIBRARY DEPARTMENT
    pages: [167]

  - slug: innovation-and-economic-development
    label: Innovation & Economic Development
    document_term: INNOVATION & ECONOMIC DEVELOPMENT
    pages: [167]
    note: >-
      The heading at p167:53 is spelled correctly; the department's own total
      row at p167:61 prints "INNOVATION & ECONOMIC DEVELOPEMENT" and wraps
      "TOTAL" onto p167:62. document_term is the heading.

  - slug: general-services
    label: General Services
    document_term: GENERAL SERVICES
    pages: [167, 168]

  - slug: administrative-services
    label: Administrative Services
    document_term: ADMINISTRATIVE SERVICES
    pages: [168]

  - slug: police-department
    label: Police Department
    document_term: POLICE DEPARTMENT
    pages: [168, 169]

  - slug: community-development
    label: Community Development
    document_term: COMMUNITY DEVELOPMENT
    pages: [169]

  - slug: public-works
    label: Public Works
    document_term: PUBLIC WORKS
    pages: [169, 170]
    note: >-
      Closes as "PUBLIC WORKS DEPARTMENT TOTAL" (p170:11), not "PUBLIC WORKS
      TOTAL". The heading and the total row disagree, and only here.

  - slug: fire-department
    label: Fire Department
    document_term: FIRE DEPARTMENT
    pages: [170]

divisions:
  - slug: city-council
    label: City Council
    department: city-council
    pages: [85, 167]

  - slug: city-manager
    label: City Manager
    department: city-manager
    pages: [89, 167]

  - slug: city-clerk
    label: City Clerk
    department: city-manager
    pages: [89, 167]

  - slug: city-attorney
    label: City Attorney
    department: city-attorney
    pages: [93, 167]

  - slug: risk-management
    label: Risk Management
    department: city-attorney
    pages: [93]
    note: >-
      Printed on p93 and on no other page, and none of its money reaches
      pp.167-170 at all. p93 funds it entirely from General Liability and
      Workers Comp Insurance — two internal service funds — so its General Fund
      slice is zero: p93's General Fund row is 2,325,429, which is the City
      Attorney division's own Division Total to the dollar in all four columns,
      and p167:41's CITY ATTORNEY TOTAL prints that same figure. So the
      department has one division on a General Fund schedule and two here, and
      the second is invisible to the first rather than folded into it.

  - slug: library
    label: Library
    department: library-department
    pages: [115, 167]

  - slug: innovation-and-economic-devel
    label: Innovation & Economic Devel
    department: innovation-and-economic-development
    pages: [111, 167]
    note: >-
      The label wraps at the same point on both schedules: "Innovation &
      Economic" / "Devel", at p167:55-56 and at p111:11-12. The city abbreviates
      the division where it spells the department out, so the two are not the
      same string even ignoring case.

  - slug: airport
    label: Airport
    department: innovation-and-economic-development
    pages: [111]
    note: >-
      Printed on p111 and on no other page, and funded by ONE fund: p111's
      Airport row is 3,000,829, which is this division's whole Division Total in
      all four columns, and data/funds.yaml resolves that label to fund 600
      (enterprise). 601, CIP Airport, pays none of it. That is why a General
      Fund schedule prints no row for it, and it carries a Debt Services line
      INNOVATION & ECONOMIC DEVELOPMENT's p167 block does not.

  - slug: general-services
    label: General Services
    department: general-services
    pages: [108, 167, 168]
    note: >-
      Straddles a page break: Wages & Benefits on p167:65, Services & Supplies
      and Debt Services on p168:7 and p168:9, and the printed Total on p168:11.

  - slug: administrative-services
    label: Administrative Services
    department: administrative-services
    pages: [97, 168]

  - slug: finance
    label: Finance
    department: administrative-services
    pages: [97, 168]

  - slug: human-resources
    label: Human Resources
    department: administrative-services
    pages: [97, 168]

  - slug: information-technology
    label: Information Technology
    department: administrative-services
    pages: [97]
    note: >-
      Printed on p97 and on no other page. The largest division missing from
      pp.167-170 by a wide margin: $6,840,179 in FY2025-26, against the whole
      department's $14,192,079. Fund 720 (Information Technology, internal
      service) pays more of ADMINISTRATIVE SERVICES than the General Fund does,
      which is why pp.167-170 — a General Fund schedule — cannot show it.

  - slug: cybersecurity
    label: Cybersecurity
    department: administrative-services
    pages: [97]
    note: >-
      Printed on p97 and on no other page. Wages & Benefits falls to $0 in both
      budget years after $54,865 and $276,442 in the two historical ones, with
      Services & Supplies flat at $665,190 — a division that stops employing
      anyone rather than one that closes.

  - slug: police-administration
    label: Police Administration
    department: police-department
    pages: [119, 168]

  - slug: patrol
    label: Patrol
    department: police-department
    pages: [119, 168]

  - slug: support-services
    label: Support Services
    department: police-department
    pages: [119, 168]

  - slug: special-operations
    label: Special Operations
    department: police-department
    pages: [119, 168, 169]

    note: >-
      Straddles a page break: Wages & Benefits and Services & Supplies on p168,
      Capital Outlay and the printed Total on p169.

  - slug: horizons
    label: Horizons
    department: police-department
    pages: [119]
    note: >-
      Printed on p119 and on no other page. The city's youth and family
      services programme, run under POLICE DEPARTMENT.

  - slug: community-development-admin
    label: Community Development Admin
    department: community-development
    pages: [101, 169]
    note: >-
      The label wraps, and the two schedules break it in DIFFERENT places:
      "Community" / "Development Admin" on p169:15-16, but "Community
      Development" / "Admin" on p101:11-12. On both, the continuation sits below
      the first object row rather than beside the first half.

  - slug: building-and-safety
    label: Building & Safety
    department: community-development
    pages: [101, 169]

  - slug: engineering
    label: Engineering
    department: community-development
    pages: [101, 169]

  - slug: housing-and-human-services
    label: Housing & Human Services
    department: community-development
    pages: [101, 169]
    note: >-
      The label wraps at the same point on both schedules: "Housing & Human" /
      "Services", at p169:33-34 and at p101:29-30.

  - slug: planning
    label: Planning
    department: community-development
    pages: [101, 169]

  - slug: public-works-administration
    label: Public Works Administration
    department: public-works
    pages: [124, 169]
    note: >-
      The label wraps at the same point on both schedules: "Public Works" /
      "Administration", at p169:49-50 and at p124:11-12.

  - slug: maintenance
    label: Maintenance
    department: public-works
    pages: [124, 169]

  - slug: environmental-services
    label: Environmental Services
    department: public-works
    pages: [124, 169, 170]
    note: >-
      Straddles a page break: Wages & Benefits on p169:61, Services & Supplies
      on p170:7, and the printed Total on p170:9.

  - slug: water-resources
    label: Water Resources
    department: public-works
    pages: [124]
    note: >-
      Printed on p124 and on no other page, and the largest division in the
      city: $53,143,833 in FY2025-26, more than a fifth of all citywide
      expenditure. Water and sewer are enterprise funds, so a General Fund
      schedule prints none of it.

  - slug: fire-administration
    label: Fire Administration
    department: fire-department
    pages: [105, 170]
    note: >-
      One object row only — Services & Supplies, p170:15. The Livermore-
      Pleasanton fire service is contracted, so the General Fund carries no
      fire wages line at all, and Fire Administration's Total, FIRE DEPARTMENT
      TOTAL and that single row are three printed statements of one figure.
