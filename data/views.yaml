# The site's pages, in nav order, the page it opens on first. `fisc export`
# loads this file through the export command's loadViews, which refuses an
# unknown key, a projection or role it cannot resolve against Go's constants,
# and a row naming no taxonomy.yaml category. What a declared chart must
# satisfy is validateOverview's and schema/page.schema.json's, not this
# file's.
#
# Only what is authored is written here. A view's year control is filled by
# Go from the documents actually built, and what a node of the expansion
# schedule splits into is internal/project's, never this file's.
schema_version: 1
views:
  # The page the site opens on: the spine's money with no gesture, three bars of
  # percentage shares per year, each a table of printed cells glance.js groups
  # and sums, the spine's figure beside each. Reads department-funding beside
  # the spine for the third bar, and the export refuses rather than open on
  # no page when that is not built.
  - path: index.html
    nav: At a glance
    template: glance.html.tmpl
    projection: sankey
    year_control: true
    reads: [department-funding]
    title: Livermore's budget at a glance
    lede: >-
      Where the money the city budgets comes from, what it buys and which
      department spends it, each as a share of the whole. Each bar adds up
      figures the city printed, and the total of all of them is shown beside
      it.

  # The same money as a Sankey. No title: sankeyTitle names the year in each
  # year's <title>, which a declared one would drop.
  - path: flows.html
    nav: Flows
    template: flows.html.tmpl
    projection: sankey
    # The year control lists every built document of this projection, oldest
    # first; the page opens on the last of them.
    year_control: true
    overview:
      form: sankey
      # The chart is the expansion schedule out of each year's column: the
      # spine's nodes as roots, each splitting in place into its members. The
      # page's figures and years stay the spine's.
      projection: expansion
      sankey:
        # The spine's column order, which a root of the expansion is placed
        # by; a member is placed by its parent (site/sankey.js expansionSlots).
        tiers: [0, 2, 5]
        # The expansion schedule's canvas: 40px a node of the busiest column,
        # from 820px, so the spine lays out as it did, to 4800px.
        # site/layout.test.mjs pins what each frontier draws under a pixel at
        # it.
        grow: {node_px: 40, floor: 820, ceiling: 4800}
        # Per split, so a tail stays inside the node it splits and splits back
        # into that node's members alone. Divisions are inert on fund/100 (23)
        # and fold an object category's 26-29.
        split_caps:
          - {split: funds, cap: 8, tail: funds}
          - {split: divisions, cap: 24, tail: divisions}
          - {split: object-rows, cap: 8, tail: object rows}
          - {split: lines, cap: 8, tail: lines}
          - {split: receivers, cap: 8, tail: funds}

  # The same expansion schedule as ranked bars, each side a spine column
  # whose roots open in place. The middle column is no side: a fund group
  # both takes in and pays out, and validateSides refuses it.
  - path: ledger.html
    nav: Bars
    template: ledger.html.tmpl
    projection: sankey
    year_control: true
    title: Livermore's budget as bars
    description: >-
      The City of Livermore's budget as two lists of bars, where the money
      comes from and where it goes, each opening in place into the parts the
      budget prints.
    lede: >-
      Where the money comes from and where it goes, each a list of bars on one
      scale, largest first, opening in place into the parts the budget prints.
    overview:
      form: ledger
      projection: expansion
      ledger:
        sides:
          - {tier: 0, heading: Where the money comes from}
          - {tier: 5, heading: Where the money goes}

  # Over time: the ACFR's ten audited years and the Budget Book's four
  # columns, each a table of printed points change.js stacks by kind. Its
  # own document is the ten-year schedule; the budget columns are read from
  # revenue-trends, which the builder refuses to do without.
  - path: change.html
    nav: Over time
    template: change.html.tmpl
    projection: changes-in-fund-balances
    title: Livermore's budget over time
    lede: >-
      Ten years of what the city's governmental funds took in and spent, as
      its annual financial report states them, and the current budget's four
      columns of revenue, each a sum of rows the city printed.

  # The ACFR's fund balance table, server-rendered. The section headings are
  # the blocks the schedule prints, and each entry's kind/fund_group pair is
  # what the document's own series carry; buildHistoryPage refuses a mismatch
  # in either direction.
  - path: balances.html
    nav: Fund balances
    template: history.html.tmpl
    projection: fund-balances
    sections:
      - heading: General Fund
        kind: fund_balance
        fund_group: general
      - heading: All Other Governmental Funds
        kind: fund_balance
    title: What Livermore's funds held at each year's end
    lede: >-
      The balance of the General Fund and of all other governmental funds at
      each June 30, FY2015-16 through FY2024-25, split by how freely each
      dollar can be spent: nonspendable, restricted, committed, assigned and
      unassigned.

  # One page per subject, each server-rendered by its own template and
  # loading its own client module. A page naming no projection is never
  # dropped for a missing document.
  - path: department.html
    nav: Departments
    template: department.html.tmpl
    # The funding side's document is the page's own, a year of it per column;
    # the spending side is read beside it out of the same column.
    projection: department-funding
    year_control: true
    reads: [department-spending]
    title: What each Livermore department spends, and who pays for it
    lede: >-
      Every one of the city's departments as a bar of the funds that pay
      for it. Open one to see what it spends, every fund together, and
      which funds pay for it, each read from the department's own page in
      the Budget Book.
  # The capital page renders its document as a table and loads capital.js
  # to filter it, so it is dropped when cip-projects is not built.
  - path: capital.html
    nav: Capital projects
    template: capital.html.tmpl
    projection: cip-projects
    title: Livermore's capital projects
    lede: >-
      Every project in the city's Capital Improvement Program, under the fund
      that pays for it: what the two-year budget gives each one, and what the
      plan projects for the three years after.
  - path: debt.html
    nav: Debt
    template: debt.html.tmpl
    projection: debt-service
    title: What Livermore owes
    lede: >-
      What the city budgets to pay on each of its debts, and what its debt
      agreements schedule it to pay each year through 2055, as the budget
      book prints them.

  # The caveats index names no projection, so no missing document drops it;
  # buildCaveatsPage refuses an empty one rather than link a blank page. It
  # comes before provenance so the two indexes end the nav.
  - path: caveats.html
    nav: Caveats
    template: caveats.html.tmpl
    title: What these figures do not say
    lede: >-
      Every page here shows figures the city printed, and every one of them has
      limits: a table that stops short, a total the city's own book
      contradicts, a classification that is ours rather than the city's. They
      are collected here in full, so the pages that draw the money can name
      them in a line and point here.

  # The provenance index names no projection either; Go drops it when the
  # export built no page index, for the reason every view is conditional on
  # its document.
  - path: provenance.html
    nav: Sources and data
    template: provenance.html.tmpl
    title: Every figure this site publishes, and the page it came from
    lede: >-
      Every figure this site publishes, with the document, page and byte offset
      it was read from — downloadable whole, or one page at a time.
