      #@cite     - $62,926 $25,000 $31,000"
      - term: "Police Evidence"
        pages: [136]
        derived: true
        rationale: >-
          A rename, not an abbreviation: "Police Evidence" is printed on p136
          alone, and pp. 253 and 255 number no fund of that name. It is fund
          211 because the revenue schedule and the fund-balance schedules are
          the same money. p136 prints Police Evidence between Horizons (210)
          and Grant - Federal Grant Fund (220), where 211 falls in a schedule
          ordered by fund number; it prints no Asset Seizure - County section
          at all; and the four years it carries — -, 62,926, 25,000, 31,000 —
          are exactly what pp. 186, 192, 198 and 204 give Asset Seizure -
          County as revenue. The rollup closes it: the FY 2025-26 and
          FY 2026-27 fund totals on pp. 135-139 sum to 29,279,560 and
          21,730,522, which are the special revenue funds' printed revenues
          plus transfers in on pp. 200 and 206 to the dollar. Counting both
          names as separate funds would overstate each year by the same
          25,000 and 31,000.

