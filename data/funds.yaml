      - term: "Low Income Hsng"
        pages: [76]
        derived: true
        rationale: >-
          p76 prints the short form of both this fund and its CIP twin, CIP Low
          Income Housing, and neither name is printed in full. The binding is
          this file's header arithmetic: CIP funds transfer out nothing in any
          of the four years, and the special revenue group's printed Transfers
          Out (pp. 187, 193, 199, 205) equals the sum of this and the other
          eight special-revenue p76 sources exactly, every year.
