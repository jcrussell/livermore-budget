# Canonical fund registry — the ONLY place a fund number is bound to a name,
# a fund type, and a spending-constraint classification.
#
#@cite City of Livermore, "FY 2025-2027 Budget Book" (source id: livermore-budget-fy2026-2027)
#@cite     Appendix, "List of Funds by Fund Type", PDF pp. 253-254
#@cite     Appendix, "Relationship Between Funds and Departments", PDF pp. 255-257
#@cite     Appendix, "Description of Funds", PDF pp. 258-261
#
# `number` and `name` and `type` are PUBLISHED: they are read off the appendix
# list of funds (pp. 253-254) and confirmed against the fund-by-department
# tables (pp. 255-257), which print the same 112 numbers in a cleaner layout.
# `constraint_tier` and `restriction_note` are DERIVED — our reading of the
# "Description of Funds" narrative (pp. 258-261) — and must not be presented as
# something the city printed. Where the document does not support a
# classification the tier is `unknown`; a later bead resolves those.
#
# Scope: the budget excludes fiduciary funds (Budget Book p. 51), and the
# appendix accordingly numbers none. Every fund here is a budgeted fund. The
# ACFR's fiduciary activity therefore has NO fund-number join into this file.
#
# Type mapping. The appendix has eight section headings; the schema has seven
# types. "CAPITAL IMPROVEMENT PROGRAM FUNDS" (811-840) is not a GASB fund type
# — p258 lists only five governmental types and says "Funds in red are CIP
# funds", i.e. each CIP fund is the capital-project side of an operating fund.
# Those are recorded here as `type: capital`. CIP funds that sit inside a
# proprietary fund keep that fund's type: 601/611/621/641 are `enterprise` and
# 731/741 are `internal-service`, exactly as the appendix prints them.
# The CIP-fund -> operating-fund pairing is printed in the CIP funding bridge
# table at p. 222 and is recorded in each CIP fund's restriction_note.
#
# `major` is set only where the budget book itself says so: the fund-balance
# schedules "by Major and Aggregate Non-Major Funds" (pp. 68-75) list General
# Fund, Low Income Housing Fund, and the Airport / Stormwater / Wastewater /
# Water enterprises under "Major Funds", and p255-256 label them the same way.
# It is omitted (unknown) for the internal service funds — those schedules do
# group them under "Major Funds", but an internal service fund is never a major
# fund in GASB terms, so the label is presentational and we do not repeat it.
# It is also omitted for the four enterprise CIP funds (601/611/621/641), which
# were created in FY 2024-25 (footnote, p. 68) and appear in no such schedule.
#
# `aliases` are the OTHER spellings the city prints for the same fund, each
# with the page it was read from. They are PUBLISHED text and are recorded
# verbatim, including the appendix's "Community Beneift Fund" at 291: a typo
# the city printed is stated here, not silently corrected. Every schedule that
# names a fund in prose rather than by number resolves through
# `registry.FundByLabel`, which matches EXACTLY — no prefix, no fuzzy, no case
# folding — and errors on a label no fund claims. Two funds may not claim one
# label; funds.yaml does not load if they do.
#
# Exactness is not fussiness. p76's transfer summary abbreviates to "Low
# Income Hsng", "Traffic Imp Fee", "Host Comm Impact", "Measure D" and "State
# Gas Tax", and each of those heads BOTH an operating fund and its CIP twin
# (200/812, 510/823, 282/820, 550/828, 560/834). A prefix match answers each
# one twice. Which fund p76 means is settled by arithmetic, in the fund-balance
# schedules' "Uses of Funds" pages (pp. 187, 193, 199, 205), whose "Transfers
# Out" column excludes transfers to CIP funds and is printed per fund group:
#
#   - the CIP funds transfer out NOTHING in any of the four years, so no row
#     on p76 leaves a CIP fund;
#   - the capital funds' Transfers Out — 181,971 / 210,500 / 211,150 /
#     217,485 — is p76's Traffic Imp Fee plus State Gas Tax plus Measure D,
#     exactly, in every year. Those three are 510, 560 and 550;
#   - the special revenue funds' Transfers Out — 1,083,617 / 1,259,206 /
#     817,050 / 800,550 — is p76's Low Income Hsng, Home Grant, State Grant,
#     Downtown Revital, CASP Fee, Downtown LMD, Other LMDs, Open Space and
#     Host Comm Impact, exactly, in every year. So "Low Income Hsng" is 200
#     and "Host Comm Impact" is 282, and "Open Space" is the special revenue
#     fund 300 rather than the permanent fund 471 (the permanent funds
#     transfer out nothing either).
#
# Adding an alias asserts something checkable about a printed page. Where the
# term alone does not say which fund it names — 211's "Police Evidence", 286's
# "CASP Fee" — the alias carries a `note` holding the evidence, and says so
# when the last step is our inference rather than the document's word.

schema_version: 1

funds:
  # ---------------------------------------------------------------- GENERAL
  #@cite p0253 (appendix list), p0255 ("GENERAL FUND - Major Fund")
  #@cite p0258 "The GENERAL FUND (F.100; F.101, 811) is used to account for all
  #@cite     the general revenues of the city that are not specifically levied
  #@cite     or collected for other city funds"
  - number: 100
    name: "General Fund"
    type: general
    constraint_tier: discretionary
    restriction_note: "General revenues not levied or collected for another fund; available for any general city service."
    major: true

  # -------------------------------------------------------- SPECIAL REVENUE
